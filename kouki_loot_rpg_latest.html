<html lang="ja">

<style>
:root{--panel:rgba(12,16,22,.82);--line:rgba(255,255,255,.18);--text:#f7f4e8;--gold:#ffd166;}
*{box-sizing:border-box}
.menu,.menu *{touch-action:pan-y}
html,body{width:100%;height:100%}
body{margin:0;background:#07090d;color:var(--text);font-family:Arial,sans-serif;overflow:hidden}
#stage{position:relative;width:100vw;height:100dvh;background:#07090d;display:flex;justify-content:center;align-items:flex-start}
#game{width:min(100vw,380px);height:300px;background:#18231c;image-rendering:pixelated;display:block}
.hud{display:none}
.log{
position:absolute;
left:50%;
top:310px;
transform:translateX(-50%);
width:min(95vw,760px);
max-height:120px;
overflow:hidden;
padding:8px 10px;
border:1px solid var(--line);
border-radius:8px;
background:var(--panel);
font-size:12px;
line-height:1.45;
}
.menu{position:absolute;left:12px;right:12px;top:50px;bottom:172px;max-width:720px;margin:auto;padding:14px;border:1px solid var(--line);border-radius:8px;background:rgba(8,10,14,.94);display:none;overflow:hidden;-webkit-overflow-scrolling:touch}
.menu.open{display:block}
.menuTop{position:sticky;top:0;z-index:5;background:rgba(8,10,14,.98);padding-bottom:10px;border-bottom:1px solid var(--line)}
.menuHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.menuHead h1{margin:0;font-size:20px}
.menuHeadBtns{display:flex;gap:8px}
.menuClose{height:34px;padding:0 14px;font-size:13px}
.menuBtns{display:flex;gap:8px}
.menuBtns button{height:34px;padding:0 14px;font-size:13px}
.playerStatus{
margin-top:8px;
padding:7px 9px;
border:1px solid var(--line);
border-radius:8px;
background:rgba(255,255,255,.045);
font-size:11px;
line-height:1.45;
color:#f7f4e8;
}
.playerStatus strong{
color:var(--gold);
}
.menu-grid{
display:grid;
grid-template-columns:120px 1fr;
gap:8px;
margin-top:12px;
height:calc(100% - 92px);
min-height:0;
}

.menu-grid .box{
min-height:0;
overflow:hidden;
}

.menu-grid .box:nth-child(1){
overflow-y:auto;
-webkit-overflow-scrolling:touch;
}

.menu-grid .box:nth-child(2){
overflow-y:auto;
-webkit-overflow-scrolling:touch;
}
.box{border:1px solid var(--line);border-radius:8px;padding:10px;background:rgba(255,255,255,.04)}
.box h2{margin:0 0 8px;font-size:13px;color:var(--gold)}
.item-list{display:grid;gap:8px;max-height:none;overflow:visible}
.invGroup{display:grid;gap:5px;padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.025)}
.invGroupTitle{font-size:12px;color:var(--gold);padding:2px 0}
.item-row{padding:7px;border-radius:6px;background:rgba(255,255,255,.06);font-size:12px;min-height:39px}
.item-row.empty{opacity:.45;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.025)}
.item-row.clickable{cursor:pointer}
.item-row.equipped{outline:1px solid var(--gold);background:rgba(255,209,102,.12)}
.item-row strong{display:block;font-size:13px;color:#fff}
.itemLockBtn{
position:absolute;
right:6px;
top:6px;
width:42px;
height:22px;
padding:0;
font-size:11px;
font-weight:bold;
background:#222;
color:#fff;
border:1px solid rgba(255,255,255,.25);
border-radius:4px;
}

.itemLockBtn.locked{
background:#ffd166;
color:#111;
border:1px solid #fff;
}

.durCircle{
position:absolute;
right:12px;
top:34px;
width:26px;
height:26px;
border-radius:50%;
border:1px solid rgba(255,255,255,.28);
}

.durInner{
position:absolute;
left:5px;
top:5px;
width:14px;
height:14px;
border-radius:50%;
background:#111;
}
.affixes{margin-top:4px;color:#bfe2ff}
.drop-toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);min-width:min(82vw,420px);padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:rgba(5,7,10,.88);text-align:center;opacity:0;pointer-events:none}
.drop-toast.show{opacity:1}
.confirmPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);padding:16px;border:1px solid var(--line);border-radius:10px;background:rgba(5,7,10,.96);display:none;z-index:20;text-align:center}
.confirmPanel.open{display:block}
.confirmPanel p{margin:0 0 14px;font-weight:700}
.confirmBtns{display:flex;gap:10px;justify-content:center}
.confirmBtns button{height:36px;padding:0 20px}
.testBtns{display:grid;gap:10px}
.testBtns button{height:38px}
.controls{position:absolute;left:0;right:0;bottom:42px;height:128px;pointer-events:none}
#pad{position:absolute;left:24px;bottom:0;width:120px;height:120px;background:rgba(37,43,50,.9);border:3px solid #76808c;border-radius:50%;pointer-events:auto;touch-action:none}
#stick{width:50px;height:50px;background:#d9e0e8;border-radius:50%;position:absolute;left:32px;top:32px}
.small-buttons{position:absolute;left:158px;bottom:10px;display:grid;grid-template-columns:48px 68px;gap:8px;pointer-events:auto}
button{border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;background:#343a42;font-weight:700;touch-action:manipulation}
#pauseBtn{width:48px;height:42px;font-size:17px}
#menuBtn{width:68px;height:42px;font-size:13px}
@media(max-width:520px){
#game{width:min(100vw,380px);height:300px}
.log{
display:block;
top:304px;
height:76px;
max-height:76px;

line-height:1.35;

.menu-grid{

.menu{

right:6px;

.item-row strong{
font-size:11px;

.invGroupTitle{

.affixes{

</style>
</head>

const baseByType={
weapon:5,
armor:4,
head:3,
arm:3,
waist:3,
leg:3,
neck:4,
ring:4,
bracelet:4,
magic:6
};

return Math.round(
(baseByType[type]||6)
+level*rand(1.2,2.2)
+enemy.bossRank*rand(4,8)
);
}

static templateByType(type){
const table={
weapon:WEAPON_NAMES,
armor:ARMOR_NAMES,
magic:MAGIC_NAMES,
head:HEAD_NAMES,
arm:ARM_NAMES,
waist:WAIST_NAMES,
leg:LEG_NAMES,
neck:NECK_NAMES,
ring:RING_NAMES,
bracelet:BRACELET_NAMES
};

return choose(table[type]||WEAPON_NAMES);
}

static makeAffixes(type,count,enemy,rarity){
const affixes=[];
const used=new Set();

for(let i=0;i<count;i++){
let pool=AFFIX_POOL.filter(a=>!used.has(a.name));

if(type==="magic"){
pool=pool.filter(a=>[
"fire",
"thunder",
"poison",
"ice",
"dark",
"light",
"wind",
"magicPower",
"magicSpeed",
"crit",
"luck",
"drain",
"regen",
"bossDamage"
].includes(a.stat));

if(!pool.length)pool=AFFIX_POOL.filter(a=>!used.has(a.name));
}

const a=choose(pool.length?pool:AFFIX_POOL);
used.add(a.name);

let value=Math.round(
rand(a.min,a.max)*
(1+enemy.level/12)*
(1+enemy.bossRank/10)*
rarity.bonus
);

if(enemy.distanceRate>=.9&&enemy.bossRank>0)value=Math.round(value*1.25);

affixes.push({name:a.name,stat:a.stat,value});
}

return affixes;
}

static applyDisplayName(item){
if(item.type==="weapon"){
item.name=baseWeaponName(item.kind,item.affixes.length);
item.displayName=affixPrefixName(item)+item.name;
}
}

static rollRarity(enemy,game,luck){
const rate=enemy.distanceRate||0;
const boss=enemy.bossRank||0;
const r=Math.random();
let legendary=0,epic=0,rare=0;
if(rate<.30){
legendary=0;
epic=.02+luck*.0008;
rare=.22+rate*.35+luck*.002;
}else if(rate<.70){
legendary=.002+(rate-.30)*.025+boss*.0008+luck*.001;
epic=.08+(rate-.30)*.28+boss*.002+luck*.002;
rare=.34+(rate-.30)*.18+luck*.002;
}else if(rate<.90){
legendary=.015+(rate-.70)*.18+boss*.0025+luck*.0015;
epic=.22+(rate-.70)*.38+boss*.003+luck*.002;
rare=.42+luck*.001;
}else{
legendary=.10+(rate-.90)*1.6+boss*.006+luck*.002;
epic=.36+(rate-.90)*.5+boss*.002+luck*.0015;
rare=.36;
}
if(rate<.30)legendary=0;
legendary=clamp(legendary,0,.42);
epic=clamp(epic,0,.55);
rare=clamp(rare,0,.62);
if(r<legendary)return RARITIES[3];
if(r<legendary+epic)return RARITIES[2];
if(r<legendary+epic+rare)return RARITIES[1];
return RARITIES[0];
}
}
class Player{
constructor(){
this.x=800;this.y=600;this.size=24;this.hp=100;this.maxHp=100;
this.gold=0;
this.herb=0;
this.dirX=0;this.dirY=1;this.invuln=0;this.attackTimer=0;this.magicTimer=0;
this.weaponDurability=100;
this.attackHitIds=new Set();this.swordX=this.x;this.swordY=this.y;
}
update(game){
const input=game.input;
let mx=input.moveX,my=input.moveY;
this.maxHp=CONFIG.baseHp+stat(game,"hp")*8;
this.hp=clamp(this.hp,0,this.maxHp);
const speedStat=stat(game,"speed");

const speedBonus=(1.0*speedStat)/(speedStat+100);

const speed=Math.min(
3.0,
2.0+speedBonus
);
const dt=this.dt||1;

this.x=clamp(
this.x+mx*speed*dt,
10,
CONFIG.worldW-10
);

this.y=clamp(
this.y+my*speed*dt,
10,
CONFIG.worldH-10
);
if(mx||my){this.dirX=mx;this.dirY=my}
if(this.invuln>0)this.invuln--;
if(this.magicTimer>0)this.magicTimer--;

if(this.poisonTime>0){
this.poisonTime--;
if(this.poisonTime%30===0){
this.hp=clamp(this.hp-(this.poisonPower||1),0,this.maxHp);
}
}

applyRegen(game);
let target=null,min=360;
for(const e of game.enemies){
if(!e.alive)continue;
const d=dist(this.x,this.y,e.x,e.y);
if(d<min){min=d;target=e}
}
if(target&&!game.paused&&!game.menuOpen&&!game.playerInVillage){
const a=Math.atan2(target.y-this.y,target.x-this.x);
this.dirX=Math.cos(a);this.dirY=Math.sin(a);
const spec=game.inventory.weaponSpec();
const meleeRange=spec.range+target.size/2+12;
if(min<=meleeRange&&this.attackTimer<=0)this.startAttack(game);
if(false&&this.magicTimer<=0){
game.castMagic();
this.magicTimer=Math.max(90,180-Math.floor((stat(game,"speed")+stat(game,"magicSpeed"))*.6));
}
}
if(this.attackTimer>0)this.updateAttack(game);
}
startAttack(game){
const spec=game.inventory.weaponSpec();

const weaponItem=game.inventory.equipment.weapon;

if(weaponItem){
if(weaponItem.durability==null)weaponItem.durability=100;

weaponItem.durability=clamp(
weaponItem.durability-0.2,
0,
100
);

if(
weaponItem.durability<=0 &&
!weaponItem.locked
){
game.spawnAffixBurst(
this.x,
this.y,
"crit"
);

game.addLog(
`${weaponItem.displayName||weaponItem.name} が壊れた`
);

game.inventory.items=
game.inventory.items.filter(
i=>i.id!==weaponItem.id
);

game.inventory.weapon=null;
game.inventory.equipment.weapon=null;

game.inventory.fixEquips();
}
}

this.attackTotal=Math.max(10,spec.duration*2-Math.floor(stat(game,"speed")*.01));
this.attackTimer=this.attackTotal;
this.attackHitIds.clear();
}
updateAttack(game){
const spec=game.inventory.weaponSpec();
this.attackTimer--;
const angle=Math.atan2(this.dirY,this.dirX);
const total=Math.max(1,this.attackTotal||spec.duration);
const swing=clamp((total-this.attackTimer)/total,0,1);
let swordAngle=angle;
let len=spec.range;

if(spec.key==="spear"){
const pull=swing<0.45
? -18*(swing/0.45)
: -18+((swing-0.45)/0.55)*(len+18);

this.swordX=this.x+Math.cos(angle)*pull;
this.swordY=this.y+Math.sin(angle)*pull;
}else{
swordAngle=angle-spec.arc/2+swing*spec.arc;
this.swordX=this.x+Math.cos(swordAngle)*len;
this.swordY=this.y+Math.sin(swordAngle)*len;
}
for(const enemy of game.enemies){
if(!enemy.alive)continue;
if(enemy.attackPhase!=="active")continue;

const enemyLen=CONFIG.enemySwordRange+(enemy.bossRank?18:0)+Math.min(30,enemy.level*.28);
const enemyTotal=CONFIG.enemySwordActive;
const enemyProgress=clamp((enemyTotal-enemy.attackTimer)/enemyTotal,0,1);

const enemyBaseAngle=Math.atan2(enemy.attackDirY,enemy.attackDirX);
const enemyArc=enemy.bossRank?2.4:2.0;
const enemySwordAngle=enemyBaseAngle-enemyArc/2+enemyProgress*enemyArc;

const ex1=enemy.x;
const ey1=enemy.y;
const ex2=enemy.x+Math.cos(enemySwordAngle)*enemyLen;
const ey2=enemy.y+Math.sin(enemySwordAngle)*enemyLen;

if(segmentCross(this.x,this.y,this.swordX,this.swordY,ex1,ey1,ex2,ey2)){
const d=Math.max(1,dist(this.x,this.y,enemy.x,enemy.y));
const nx=(this.x-enemy.x)/d;
const ny=(this.y-enemy.y)/d;
const clashPower=10;

this.x+=nx*clashPower*.55;
this.y+=ny*clashPower*.55;
enemy.knockback(-nx,-ny,clashPower);

enemy.clashFlash=8;
enemy.attackTimer=Math.max(enemy.attackTimer,6);
enemy.attackPhase="active";
this.attackTimer=Math.max(this.attackTimer,6);

const weaponItem=game.inventory.equipment.weapon;

if(weaponItem){
if(weaponItem.durability==null)weaponItem.durability=100;

weaponItem.durability=clamp(
weaponItem.durability-3,
0,
100
);
}

game.spawnAffixBurst(
(this.x+enemy.x)/2,
(this.y+enemy.y)/2,
"melee"
);

game.addLog("武器同士がぶつかった");
return;
}
}

const hits=[];
for(const enemy of game.enemies){
if(!enemy.alive||this.attackHitIds.has(enemy.id))continue;
const check=segmentHit(this.x,this.y,this.swordX,this.swordY,enemy.x,enemy.y,enemy.size/2+8);
if(check.hit)hits.push({enemy,t:check.t});
}
hits.sort((a,b)=>a.t-b.t);
let stopped=false;
for(const h of hits){
const enemy=h.enemy;
if(!stopped){this.stopSwordBeforeEnemy(swordAngle,len,h.t);stopped=true}

if(enemy.attackTimer>0){
const clashPower=8;
enemy.knockback(this.dirX,this.dirY,clashPower);
this.x-=this.dirX*clashPower*.45;
this.y-=this.dirY*clashPower*.45;
enemy.clashFlash=8;
enemy.attackTimer=Math.max(enemy.attackTimer,6);
enemy.attackPhase="active";
this.attackTimer=Math.max(this.attackTimer,6);
game.spawnAffixBurst(enemy.x,enemy.y,"melee");

break;
}

let attackPower=CONFIG.swordDamage+spec.damage;

const weaponItem=game.inventory.equipment.weapon;

if(
weaponItem &&
weaponItem.locked &&
(weaponItem.durability??100)<=0
){
attackPower=1;
}

const r=calcDamage(game,attackPower,enemy,"melee");
enemy.takeDamage(r.damage);
this.attackHitIds.add(enemy.id);
enemy.knockback(this.dirX,this.dirY,(spec.knock||2)+stat(game,"attack")*.05);
applyElementEffects(game,enemy,r.damage,this.dirX,this.dirY);
applyDrain(game,r.damage);
game.spawnAffixBurst(enemy.x,enemy.y,r.critical?"crit":"melee");
game.addLog(`${enemy.name}に${r.damage}${r.critical?" CRIT":""}`);
if(enemy.alive)break;
}
}
stopSwordBeforeEnemy(angle,len,t){
const stop=Math.max(0,t-.015);
this.swordX=this.x+Math.cos(angle)*len*stop;
this.swordY=this.y+Math.sin(angle)*len*stop;
}
takeDamage(amount,game){
if(this.invuln>0)return;
amount=Math.max(1,amount-stat(game,"defense"));
this.hp=clamp(this.hp-amount,0,this.maxHp);
this.invuln=45;
}
draw(ctx,c){
const x=c.sx(this.x),y=c.sy(this.y);
const armor=globalThis.game.inventory.armorSpec();
const weapon=globalThis.game.inventory.weaponSpec();
const magic=globalThis.game.inventory.magicSpec();

const weaponItem=globalThis.game.inventory.equipment.weapon;

const headItem=globalThis.game.inventory.equipment.head;
const headSpec=
HEAD_TYPES.find(
h=>h.key===headItem?.kind
)||HEAD_TYPES[0];

const armItem=globalThis.game.inventory.equipment.arm;
const armSpec=
ARM_TYPES.find(
a=>a.key===armItem?.kind
)||ARM_TYPES[0];

const legItem=globalThis.game.inventory.equipment.leg;
const legSpec=
LEG_TYPES.find(
l=>l.key===legItem?.kind
)||LEG_TYPES[0];

const waistItem=globalThis.game.inventory.equipment.waist;
const waistSpec=
WAIST_TYPES.find(
w=>w.key===waistItem?.kind
)||WAIST_TYPES[0];
this.drawAura(ctx,x,y,globalThis.game.inventory.equippedAffixes());
ctx.fillStyle="rgba(0,0,0,.38)";
ctx.fillRect(x-13,y+13,26,6);
ctx.globalAlpha=this.invuln>0&&Math.floor(this.invuln/4)%2===0?.45:1;
const armorItem=globalThis.game.inventory.equipment.armor;

ctx.fillStyle=itemRankColor(armorItem)||armor.body;
ctx.fillRect(x-10,y-8,20,22);
ctx.fillStyle=itemRankColor(armorItem)||armor.trim;
ctx.fillRect(x-10,y-8,20,5);

ctx.fillStyle=itemRankColor(waistItem)||waistSpec.color;
ctx.fillRect(x-11,y+7,22,4);

ctx.fillStyle=itemRankColor(armItem)||armSpec.color;
ctx.fillRect(x-15,y-6,5,14);
ctx.fillRect(x+10,y-6,5,14);
ctx.fillStyle="#f0c090";
ctx.fillRect(x-7,y-20,14,12);
ctx.fillStyle=itemRankColor(headItem)||headSpec.color;
ctx.fillRect(x-8,y-23,16,5);
ctx.fillStyle=magic.color;
ctx.fillRect(x+8,y-25,6,9);
ctx.fillStyle="#101010";
ctx.fillRect(x-5,y-15,2,2);
ctx.fillRect(x+4,y-15,2,2);
ctx.fillStyle=itemRankColor(legItem)||legSpec.color;
ctx.fillRect(x-10,y+14,6,8);
ctx.fillRect(x+4,y+14,6,8);
ctx.globalAlpha=1;
if(this.attackTimer>0||this.clashFlash>0){
const weaponDurability=weaponItem?.durability??100;
const dur=clamp(weaponDurability,0,100);
const damageRate=1-dur/100;

const sx=c.sx(this.swordX);
const sy=c.sy(this.swordY);

const bend=damageRate*22;
const dx=sx-x;
const dy=sy-y;
const len=Math.max(1,Math.hypot(dx,dy));
const nx=-dy/len;
const ny=dx/len;

const midX=(x+sx)/2+nx*bend;
const midY=(y+sy)/2+ny*bend;

ctx.strokeStyle=itemRankColor(weaponItem)||weapon.color;
ctx.lineWidth=Math.max(1,PLAYER_ATTACK_SETTING.bladeWidth*(0.35+dur/100*.65));
ctx.lineCap="round";
ctx.beginPath();
ctx.moveTo(x,y);
ctx.quadraticCurveTo(midX,midY,sx,sy);
ctx.stroke();

ctx.strokeStyle="#ffffff";
ctx.lineWidth=Math.max(1,PLAYER_ATTACK_SETTING.bladeWidth/3*(0.35+dur/100*.65));
ctx.beginPath();
ctx.moveTo(x,y);
ctx.quadraticCurveTo(midX,midY,sx,sy);
ctx.stroke();
}
this.drawHpBar(ctx,x,y);
}
drawHpBar(ctx,x,y){
const w=46,ratio=clamp(this.hp/this.maxHp,0,1);
ctx.fillStyle="rgba(0,0,0,.55)";
ctx.fillRect(x-w/2-1,y-39,w+2,8);
ctx.fillStyle="#f4f4f4";
ctx.fillRect(x-w/2,y-38,w,6);
ctx.fillStyle=ratio>.5?"#55e06a":ratio>.22?"#ffd166":"#ff5f6d";
ctx.fillRect(x-w/2,y-38,w*ratio,6);
}
drawAura(ctx,x,y,affixes){
const a=affixes.slice(0,22);
if(!a.length)return;
const t=performance.now()/1000;
ctx.save();
for(let i=0;i<a.length;i++){
const color=AFFIX_VISUALS[a[i].stat]||"#fff";
const power=a[i].value||1;
const size=2;
const radiusBoost=clamp(power*.28,0,60);
const ang=t*(1.2+i*.07)+i*Math.PI*2/a.length;
const r=21+(i%4)*5+radiusBoost;
ctx.globalAlpha=clamp(.25+power*.006+.25*Math.sin(t*3+i),.25,.85);
ctx.fillStyle=color;
ctx.beginPath();
ctx.arc(x+Math.cos(ang)*r,y-3+Math.sin(ang)*r*.65,size,0,Math.PI*2);
ctx.fill();
if(power>=45){
ctx.globalAlpha=.16;
ctx.strokeStyle=color;
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(x,y-3,r*.7,0,Math.PI*2);
ctx.stroke();
}
}
ctx.restore();
}
}
class Enemy{
constructor({x,y,level=1,bossRank=0,type="goblin"}){
this.id=uid();this.x=x;this.y=y;this.spawnX=x;this.spawnY=y;this.level=level;this.bossRank=bossRank;
this.type=type;
this.distanceRate=distanceRateFromVillage(x,y);

const typeData={

goblin:{name:"剣ゴブリン",size:1,hp:1,speed:1,color:"#7a3a32",weapon:"sword"},

daggerGoblin:{
name:"短剣ゴブリン",
size:.9,
hp:.75,
speed:1.35,
color:"#5d8f3a",
weapon:"dagger"
},

spearman:{
name:"槍兵",
size:1,
hp:1.1,
speed:.95,
color:"#4a6fb8",
weapon:"spear"
},

greatsword:{
name:"大剣兵",
size:1.2,
hp:1.6,
speed:.75,
color:"#8a5d2a",
weapon:"greatsword"
},

wolf:{name:"Wolf",size:.85,hp:.75,speed:1.7,color:"#909090"},
spider:{name:"Spider",size:.9,hp:.08,speed:.8,color:"#7a2ad6"},
golem:{name:"Golem",size:1.45,hp:2.8,speed:.45,color:"#707070"}

};

this.typeData=typeData[this.type]||typeData.goblin;

this.size=(bossRank?30+bossRank*1.15:22+level*.35)*this.typeData.size;
const normalHp=Math.round((24+level*8)*this.typeData.hp);
this.maxHp=bossRank?Math.round(normalHp*10+bossRank*30):normalHp;
this.hp=this.maxHp;
this.alive=true;this.hitTimer=0;this.stunTime=0;
this.poisonTime=0;this.poisonPower=0;this.burnTime=0;this.burnPower=0;
this.slowTime=0;this.slowPower=0;this.darkTime=0;this.darkPower=0;this.iceStack=0;
this.attackCooldown=randInt(20,80);
this.attackTimer=0;
this.poisonShotCooldown=randInt(70,150);
this.attackPhase="";
this.attackDirX=0;
this.attackDirY=1;
this.attackHit=false;
this.name=bossRank
?`Rank ${bossRank} ${this.typeData.name} Boss`
:`Lv${level} ${this.typeData.name}`;
}
update(game){
if(!this.alive)return;
if(this.clashFlash>0)this.clashFlash--;
this.applyDots();
if(this.attackCooldown>0)this.attackCooldown--;
if(this.attackTimer>0)this.updateSwordAttack(game);
if(this.stunTime>0){this.stunTime--;return}
const d=dist(this.x,this.y,game.player.x,game.player.y);
const vd=dist(this.x,this.y,VILLAGE.x,VILLAGE.y);
if(vd<VILLAGE.radius+20){
const p=Math.max(1,vd);
this.x+=(this.x-VILLAGE.x)/p*1.4;
this.y+=(this.y-VILLAGE.y)/p*1.4;
return;
}
if(this.type==="spider"&&!game.playerInVillage&&this.attackTimer<=0){
if(this.poisonShotCooldown>0)this.poisonShotCooldown--;

if(d<360&&this.poisonShotCooldown<=0){
this.shootPoison(game);
this.poisonShotCooldown=randInt(100,170);
return;
}
}

const enemyWeapon=this.enemyWeaponSpec();

if(!game.playerInVillage&&this.attackTimer<=0&&d<enemyWeapon.range+28&&this.attackCooldown<=0){
this.startSwordAttack(game);
return;
}
if(!game.playerInVillage&&d<420&&d>26&&this.attackTimer<=0){
let s=(CONFIG.enemySpeed+this.bossRank*.006)*this.typeData.speed;
if(this.slowTime>0)s*=Math.max(.2,1-this.slowPower);
this.x+=(game.player.x-this.x)/d*s;
this.y+=(game.player.y-this.y)/d*s;
}
const touchDamage=Math.max(1,Math.floor((4+this.level*.25+(this.bossRank?this.bossRank*.15:0))-game.inventory.defenseBonus()*.12));

if(
this.type!=="spider" &&
d<this.size/2+10 &&
this.attackTimer<=0
){
game.player.takeDamage(touchDamage,game);
}
if(this.hitTimer>0)this.hitTimer--;
if(this.slowTime>0)this.slowTime--;
if(this.darkTime>0)this.darkTime--;
}
getBossDamageMultiplier(){
const d=EnemyData.bossDamageMultiplier;

if(this.bossRank>=50)return d[50];
if(this.bossRank>=40)return d[40];
if(this.bossRank>=32)return d[32];
if(this.bossRank>=24)return d[24];
if(this.bossRank>=16)return d[16];
if(this.bossRank>=10)return d[10];
if(this.bossRank>=3)return d[3];

return 1;
}
getBossAttackSpeedMultiplier(){
const d=EnemyData.bossAttackSpeed;

if(this.bossRank>=50)return d[50];
if(this.bossRank>=40)return d[40];
if(this.bossRank>=32)return d[32];
if(this.bossRank>=24)return d[24];
if(this.bossRank>=16)return d[16];
if(this.bossRank>=10)return d[10];
if(this.bossRank>=3)return d[3];

return 1;
}
shootPoison(game){
const d=Math.max(1,dist(this.x,this.y,game.player.x,game.player.y));
const vx=(game.player.x-this.x)/d*3.1;
const vy=(game.player.y-this.y)/d*3.1;

game.enemyProjectiles.push(new EnemyProjectile({
x:this.x,
y:this.y,
vx,
vy,
type:"poison",
damage:Math.max(3,Math.floor(4+this.level*.35))
}));

game.addLog("毒グモが毒液を吐いた");
}

enemyWeaponSpec(){

if(this.type==="spider"){
return {
range:0,
charge:999999,
active:0,
cooldown:999999,
arc:0,
damage:0,
knock:0,
line:0
};
}

const weapon=this.typeData.weapon||"sword";

const data={
dagger:{range:30,charge:8,active:8,cooldown:45,arc:1.8,damage:.75,knock:3,line:3},
sword:{range:42,charge:18,active:10,cooldown:80,arc:2.0,damage:1,knock:6,line:5},
spear:{range:90,charge:24,active:10,cooldown:95,arc:.08,damage:1.05,knock:7,line:4,thrust:true},
greatsword:{range:58,charge:30,active:16,cooldown:125,arc:2.7,damage:1.45,knock:12,line:8}
};

return data[weapon]||data.sword;
}

startSwordAttack(game){
const d=Math.max(1,dist(this.x,this.y,game.player.x,game.player.y));
this.attackDirX=(game.player.x-this.x)/d;
this.attackDirY=(game.player.y-this.y)/d;
const weapon=this.enemyWeaponSpec();

this.attackTimer=weapon.charge+weapon.active;
this.attackPhase="charge";
this.attackHit=false;

let cd=weapon.cooldown+randInt(0,40)-Math.min(30,Math.floor(this.level*.25));
cd*=this.getBossAttackSpeedMultiplier();
this.attackCooldown=Math.max(10,Math.floor(cd));
}
updateSwordAttack(game){
this.attackTimer--;
const weapon=this.enemyWeaponSpec();
const activeStart=weapon.active;
if(this.attackTimer<=activeStart)this.attackPhase="active";
if(this.attackPhase==="active"&&!this.attackHit){
const len=weapon.range+(this.bossRank?18:0)+Math.min(30,this.level*.28);
const total=weapon.active;
const progress=clamp((total-this.attackTimer)/total,0,1);

const baseAngle=Math.atan2(this.attackDirY,this.attackDirX);

let swordAngle=baseAngle;
let attackLen=len;

if(weapon.thrust){
if(progress<0.4){
attackLen=len*(0.4-progress);
}else{
attackLen=len*((progress-0.4)/0.6);
}
attackLen=Math.max(10,attackLen);
}else{
const arc=this.bossRank?2.4:weapon.arc;
swordAngle=baseAngle-arc/2+progress*arc;
}

const ax=this.x;
const ay=this.y;
const bx=this.x+Math.cos(swordAngle)*attackLen;
const by=this.y+Math.sin(swordAngle)*attackLen;

const check=segmentHit(ax,ay,bx,by,game.player.x,game.player.y,game.player.size/2+12);
if(check.hit){
const bossPower=this.bossRank?Math.floor(this.bossRank*.65):0;
let dmg=Math.max(2,(10+this.level+bossPower)*weapon.damage-game.inventory.defenseBonus());
dmg=Math.floor(dmg*this.getBossDamageMultiplier());
game.player.takeDamage(dmg,game);
this.attackHit=true;
game.addLog(this.bossRank?"BOSSの剣攻撃を受けた":"敵の剣攻撃を受けた");
}
}
if(this.attackTimer<=0)this.attackPhase="";
}
applyDots(){
if(this.poisonTime>0){this.poisonTime--;this.takeDamage(this.poisonPower*(this.bossRank?.01:.02))}
if(this.burnTime>0){this.burnTime--;this.takeDamage(this.burnPower*.03)}
if(this.darkTime>0){this.takeDamage(this.darkPower*.018)}
}
takeDamage(amount){
this.hp-=amount;
this.hitTimer=8;
if(this.hp<=0){this.hp=0;this.alive=false}
}
knockback(dx,dy,power){
const resist=this.bossRank?0.35:1;
this.x+=dx*power*resist;
this.y+=dy*power*resist;
}
reviveAtSpawn(){
this.x=this.spawnX;this.y=this.spawnY;this.hp=this.maxHp;this.alive=true;this.dropped=false;this.hitTimer=0;this.stunTime=0;this.poisonTime=0;this.burnTime=0;this.slowTime=0;this.darkTime=0;this.iceStack=0;this.attackTimer=0;this.attackCooldown=randInt(20,80);this.attackHit=false;
}
draw(ctx,c){
if(!this.alive)return;
const x=c.sx(this.x),y=c.sy(this.y),s=this.size;
const levelTone=clamp(this.level/70,0,1);
ctx.fillStyle=this.stunTime>0
?"#fff366"
:this.hitTimer>0
?"#ff7a7a"
:this.bossRank
?"#682a92"
:this.typeData.color;
ctx.fillRect(x-s/2,y-s/2,s,s);
if(this.attackTimer>0||this.clashFlash>0){
if(this.attackPhase==="active"){
const weapon=this.enemyWeaponSpec();
const len=weapon.range+(this.bossRank?18:0)+Math.min(30,this.level*.28);
const total=weapon.active;
const progress=clamp((total-this.attackTimer)/total,0,1);

const baseAngle=Math.atan2(this.attackDirY,this.attackDirX);
const arc=this.bossRank?Math.max(weapon.arc,2.4):weapon.arc;
const swordAngle=baseAngle-arc/2+progress*arc;

let drawLen=len;

if(weapon.thrust){
if(progress<0.4){
drawLen=len*(0.4-progress);
}else{
drawLen=len*((progress-0.4)/0.6);
}
drawLen=Math.max(12,drawLen);
}

const bx=x+Math.cos(swordAngle)*drawLen;
const by=y+Math.sin(swordAngle)*drawLen;

ctx.lineCap="round";
ctx.strokeStyle="#ffead1";
ctx.lineWidth=weapon.line;
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(bx,by);
ctx.stroke();
}

if(this.attackPhase==="charge"){
ctx.strokeStyle="rgba(255,80,80,.35)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(x,y,s*.75+Math.sin(performance.now()/80)*2,0,Math.PI*2);
ctx.stroke();
}
}
if(this.bossRank){
ctx.strokeStyle="#ffd166";
ctx.lineWidth=3;
ctx.strokeRect(x-s/2-3,y-s/2-3,s+6,s+6);
ctx.strokeStyle="rgba(255,209,102,.35)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(x,y,s*.8+Math.sin(performance.now()/180)*3,0,Math.PI*2);
ctx.stroke();
if(this.bossRank>=24){
ctx.strokeStyle="rgba(255,255,255,.24)";
ctx.beginPath();
ctx.arc(x,y,s*1.05+Math.sin(performance.now()/120)*5,0,Math.PI*2);
ctx.stroke();
}
}
if(this.poisonTime>0){ctx.strokeStyle="#b15cff";ctx.strokeRect(x-s/2-5,y-s/2-5,s+10,s+10)}
if(this.burnTime>0){ctx.strokeStyle="#ff6a00";ctx.strokeRect(x-s/2-8,y-s/2-8,s+16,s+16)}
if(this.slowTime>0){ctx.strokeStyle="#9ee7ff";ctx.strokeRect(x-s/2-11,y-s/2-11,s+22,s+22)}
if(this.darkTime>0){ctx.strokeStyle="#4b2a7f";ctx.strokeRect(x-s/2-14,y-s/2-14,s+28,s+28)}
ctx.fillStyle="#090909";
ctx.fillRect(x-6,y-5,3,3);

class Projectile{
constructor(x,y,vx,vy,magic){
this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=70;this.magic=magic;
}
update(game){
const wind=stat(game,"wind");
this.x+=this.vx*(1+wind*.01);
this.y+=this.vy*(1+wind*.01);
this.life--;
for(const enemy of game.enemies){
if(!enemy.alive)continue;
if(dist(this.x,this.y,enemy.x,enemy.y)<enemy.size/2+8){
const m=this.magic;
const base=Math.floor(CONFIG.fireDamage*m.damageRate+game.inventory.magicBonus());
const r=calcDamage(game,base,enemy,m.key);
enemy.takeDamage(r.damage);
if(m.key==="fire")applyBurn(enemy,stat(game,"fire")+stat(game,"magicPower"));
if(m.key==="thunder")applyThunder(game,enemy,stat(game,"thunder")+stat(game,"magicPower"),1.35);
if(m.key==="poison")applyPoison(enemy,stat(game,"poison")+stat(game,"magicPower"),1.8);
applyIce(enemy,stat(game,"ice"));
applyDark(game,enemy,stat(game,"dark"),r.damage);
applyLight(game,enemy,stat(game,"light"),r.damage);
applyDrain(game,r.damage);
this.life=0;
game.spawnAffixBurst(enemy.x,enemy.y,r.critical?"crit":"magic");
game.addLog(`${enemy.name}に${m.label}${r.damage}${r.critical?" CRIT":""}`);
break;
}
}
}
draw(ctx,c){
const x=c.sx(this.x),y=c.sy(this.y),m=this.magic;
ctx.fillStyle=m.color;
ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
ctx.fillStyle=m.inner;
ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
}
}

const base=
item.type==="weapon"?"攻撃":
item.type==="armor"?"防御":
item.type==="magic"?"魔力":
item.type==="head"?"頭防御":
"能力";
const aff=item.affixes.length?item.affixes.map(a=>`${a.name}+${a.value}`).join(" / "):"付属能力なし";
const chips=item.affixes.map(a=>`<span style="display:inline-block;width:8px;height:8px;margin-right:3px;border-radius:50%;background:${AFFIX_VISUALS[a.stat]||"#fff"}"></span>`).join("");
let kind="";
if(item.type==="weapon")kind=WEAPON_TYPES.find(w=>w.key===item.kind)?.label||"Weapon";
if(item.type==="armor")kind=ARMOR_TYPES.find(a=>a.key===item.kind)?.label||"Body";
if(item.type==="magic")kind=MAGIC_TYPES.find(m=>m.key===item.kind)?.label||"Magic";
if(item.type==="head")kind=HEAD_TYPES.find(h=>h.key===item.kind)?.label||"Head";
if(item.type==="arm")kind=ARM_TYPES.find(a=>a.key===item.kind)?.label||"Arm";
if(item.type==="waist")kind=WAIST_TYPES.find(w=>w.key===item.kind)?.label||"Waist";
if(item.type==="leg")kind=LEG_TYPES.find(l=>l.key===item.kind)?.label||"Leg";
if(item.type==="neck")kind=NECK_TYPES.find(n=>n.key===item.kind)?.label||"Neck";
if(item.type==="ring")kind=RING_TYPES.find(r=>r.key===item.kind)?.label||"Ring";
if(item.type==="bracelet")kind=BRACELET_TYPES.find(b=>b.key===item.kind)?.label||"Bracelet";

const cls=["item-row"];
if(clickable)cls.push("clickable");
if(this.game.inventory.isEquipped(item))cls.push("equipped");

const data=clickable?` data-item-id="${item.id}"`:"";

const rankColors=[
"#888888",
"#44cc66",
"#3399ff",
"#ff4444",
"#ffffff",
"#ff9900",
"#ff66cc",
"#050505"
];

let rankColor=rankColors[Math.max(0,Math.min(7,item.affixes.length-1))];

if(item.affixes.length>=10){
const rainbow=[
"#ff4444",
"#ff9900",
"#ffff55",
"#44cc66",
"#3399ff",
"#aa66ff",
"#ff66cc"
];
rankColor=rainbow[Math.floor(performance.now()/90)%rainbow.length];
}

if(item.type==="weapon"&&item.durability==null){
item.durability=100;
}

const durability=item.type==="weapon"
?item.durability
:100;

const durRate=Math.max(0,Math.min(100,durability));

const lockHtml=item.type==="weapon"
?`<button class="itemLockBtn ${item.locked?"locked":""}" data-lock-id="${item.id}">
${item.locked?"LOCK":"🔓"}
</button>
<div class="durCircle" style="background:conic-gradient(#2ee66b 0% ${durRate}%, #d62828 ${durRate}% 100%);">
<div class="durInner"></div>
</div>`
:"";

return`
<div class="${cls.join(" ")}"${data} style="border-left:4px solid ${rankColor};position:relative;padding-right:${item.type==="weapon"?"42px":"7px"}">
<strong>${chips}${item.displayName||item.name}</strong>
${kind} / ${base} ${item.basePower} / Lv${item.level} / 付属${item.affixes.length}
<div class="affixes">${aff}</div>
${lockHtml}
</div>`;
}
}
const SaveSystem={
save(game){
return game.saveData();
},
load(game,data){
return game.applySaveData(data);
}
};

class Game{
constructor(){
this.canvas=document.getElementById("game");
this.ctx=this.canvas.getContext("2d");
globalThis.game=this;
this.input=new Input();
this.camera=new Camera();
this.world=new World();
this.inventory=new Inventory();
this.player=new Player();
this.enemies=[];
this.projectiles=[];
this.enemyProjectiles=[];
this.effects=[];
this.drops=[];
this.logs=[];
this.paused=false;
this.menuOpen=false;
this.playerInVillage=false;
this.wasInVillage=false;
this.spawnCooldown=0;
this.testRangeView=false;
this.currentArea=null;
this.currentBgmKey="";
this.ui=new UI(this);
this.spawnInitialEnemies();
this.tryLoadOnStart();
this.inventory.trimAll();
this.ui.refreshInventory();
this.playerInVillage=this.isInVillage(this.player.x,this.player.y);
this.wasInVillage=this.playerInVillage;
requestAnimationFrame(()=>this.loop());
}
spawnInitialEnemies(){
this.enemies=[];
const fixed=[[1050,520],[1020,700],[700,820],[1180,620],[520,620],[1360,880],[1500,520],[340,1040]];
for(const [x,y] of fixed)this.addEnemyAt(x,y);
for(let i=0;i<18;i++)this.spawnEnemyOutsideView();
this.addLog("BOSS強化 実装");
}
spawnEnemyOutsideView(){
const side=Math.floor(Math.random()*4);
const margin=CONFIG.spawnMargin;
let x=this.player.x,y=this.player.y;
if(side===0){x=this.player.x+rand(-CONFIG.viewW/2,CONFIG.viewW/2);y=this.player.y-CONFIG.viewH/2-margin}
if(side===1){x=this.player.x+rand(-CONFIG.viewW/2,CONFIG.viewW/2);y=this.player.y+CONFIG.viewH/2+margin}
if(side===2){x=this.player.x-CONFIG.viewW/2-margin;y=this.player.y+rand(-CONFIG.viewH/2,CONFIG.viewH/2)}
if(side===3){x=this.player.x+CONFIG.viewW/2+margin;y=this.player.y+rand(-CONFIG.viewH/2,CONFIG.viewH/2)}
x=clamp(x,80,CONFIG.worldW-80);
y=clamp(y,80,CONFIG.worldH-80);
if(dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.radius+330)return false;
if(dist(x,y,this.player.x,this.player.y)<420)return false;
return this.addEnemyAt(x,y);
}

spawnSquadOutsideView(){
const side=Math.floor(Math.random()*4);
const margin=CONFIG.spawnMargin+120;
let x=this.player.x,y=this.player.y;

if(side===0){x=this.player.x+rand(-CONFIG.viewW/2,CONFIG.viewW/2);y=this.player.y-CONFIG.viewH/2-margin}
if(side===1){x=this.player.x+rand(-CONFIG.viewW/2,CONFIG.viewW/2);y=this.player.y+CONFIG.viewH/2+margin}
if(side===2){x=this.player.x-CONFIG.viewW/2-margin;y=this.player.y+rand(-CONFIG.viewH/2,CONFIG.viewH/2)}
if(side===3){x=this.player.x+CONFIG.viewW/2+margin;y=this.player.y+rand(-CONFIG.viewH/2,CONFIG.viewH/2)}

x=clamp(x,120,CONFIG.worldW-120);
y=clamp(y,120,CONFIG.worldH-120);

if(dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.radius+420)return false;
if(dist(x,y,this.player.x,this.player.y)<560)return false;

this.spawnSquadAt(x,y);
return true;
}
addEnemyAt(x,y){
const level=enemyLevelByDistance(x,y);
const bossRank=rollBossRank(level);
const area=AreaData.byLocation(x,y);
const list=area.enemies||["goblin"];

let type=choose(list);

if(area.key==="village"){
const villageList=[
"goblin",
"daggerGoblin",
"spearman",
"greatsword"
];

type=choose(villageList);
}

this.enemies.push(new Enemy({x,y,level,bossRank,type}));
return true;
}

spawnSquadAt(x,y){
const area=AreaData.byLocation(x,y);
const level=enemyLevelByDistance(x,y);

let squad=[
{type:"goblin",dx:-34,dy:0},
{type:"goblin",dx:0,dy:-8},
{type:"goblin",dx:34,dy:0},
{type:"spider",dx:-22,dy:-72},
{type:"spider",dx:22,dy:-72}
];

if(area.key==="forest"||area.key==="deepForest"){
squad=[
{type:"wolf",dx:-38,dy:0},
{type:"wolf",dx:0,dy:-8},
{type:"wolf",dx:38,dy:0},
{type:"spider",dx:-24,dy:-76},
{type:"spider",dx:24,dy:-76}
];
}

if(area.key==="rock"||area.key==="deep"){
squad=[
{type:"golem",dx:0,dy:0},
{type:"goblin",dx:-44,dy:18},
{type:"goblin",dx:44,dy:18},
{type:"spider",dx:-30,dy:-82},
{type:"spider",dx:30,dy:-82}
];
}

const d=Math.max(1,dist(x,y,this.player.x,this.player.y));
const fx=(this.player.x-x)/d;
const fy=(this.player.y-y)/d;
const sxSide=-fy;
const sySide=fx;

for(const s of squad){
const front=s.dy||0;
const side=s.dx||0;

const px=x+fx*front+sxSide*side;
const py=y+fy*front+sySide*side;

const ex=clamp(px,80,CONFIG.worldW-80);
const ey=clamp(py,80,CONFIG.worldH-80);

const bossRank=Math.random()<.04?rollBossRank(level):0;
this.enemies.push(new Enemy({x:ex,y:ey,level,bossRank,type:s.type}));
}

this.addLog("敵小隊が隊列を組んで現れた");
}
cleanupEnemies(){
if(this.enemies.length<=CONFIG.maxEnemies)return;
const keep=[];
for(const e of this.enemies){
const d=dist(e.x,e.y,this.player.x,this.player.y);
if(e.alive&&d<CONFIG.activeEnemyRange)keep.push(e);
else if(!e.alive&&d<900)keep.push(e);
}
while(keep.length>CONFIG.maxEnemies)keep.shift();
this.enemies=keep;
}
autoSpawnEnemies(){
if(this.playerInVillage)return;
if(this.spawnCooldown>0){this.spawnCooldown--;return}
this.spawnCooldown=45;
const nearEnemies=this.enemies.filter(e=>e.alive&&dist(e.x,e.y,this.player.x,this.player.y)<1000).length;
if(nearEnemies>=CONFIG.targetNearEnemies){
if(Math.random()<.04 && nearEnemies<CONFIG.targetNearEnemies+10){
this.spawnSquadOutsideView();
}
this.cleanupEnemies();
return;
}
let spawned=0;
if(Math.random()<.08){
const before=this.enemies.length;
if(this.spawnSquadOutsideView())spawned+=this.enemies.length-before;
}else{
for(let i=0;i<CONFIG.autoSpawnBatch;i++){
if(this.spawnEnemyOutsideView())spawned++;
}
}
if(spawned>0)this.addLog(`敵影 ${spawned}`);
this.cleanupEnemies();
}
addLog(t){

if(
!t.includes("入手:") &&
!t.includes("糸 +") &&
!t.includes("毛皮 +") &&
!t.includes("鉄くず +") &&
!t.includes("石材 +") &&
!t.includes("G入手") &&
!t.includes("が壊れた")
){
return;
}

this.logs.unshift(t);
this.logs=this.logs.slice(0,20);
}
isInVillage(x,y){return dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.radius*.9}
reviveEnemiesFromVillageExit(){for(const e of this.enemies)e.reviveAtSpawn();this.addLog("村の外に敵が復活した")}
spawnAffixBurst(x,y,mode){
const list=this.inventory.equippedAffixes();
const active=list.length?list:[{stat:"attack",value:3}];
for(const a of active)this.effects.push(new VisualEffect(x,y,a,mode));
if(this.effects.length>180)this.effects.splice(0,this.effects.length-180);
}
castMagic(){
const a=Math.atan2(this.player.dirY,this.player.dirX);
const m=this.inventory.magicSpec();
this.projectiles.push(new Projectile(this.player.x,this.player.y,Math.cos(a)*CONFIG.fireballSpeed,Math.sin(a)*CONFIG.fireballSpeed,m));
}
saveData(){
return{
player:{x:this.player.x,y:this.player.y,hp:this.player.hp,maxHp:this.player.maxHp,gold:this.player.gold||0,herb:this.player.herb||0},
items:this.inventory.items,
weaponId:this.inventory.weapon?.id||null,
armorId:this.inventory.armor?.id||null,
magicId:this.inventory.magic?.id||null,

equipment:{
weapon:this.inventory.equipment.weapon?.id||null,
armor:this.inventory.equipment.armor?.id||null,
magic:this.inventory.equipment.magic?.id||null,

head:this.inventory.equipment.head?.id||null,
arm:this.inventory.equipment.arm?.id||null,
waist:this.inventory.equipment.waist?.id||null,
leg:this.inventory.equipment.leg?.id||null,

neck:this.inventory.equipment.neck?.id||null,

ringL:this.inventory.equipment.ringL?.id||null,
ringR:this.inventory.equipment.ringR?.id||null,

braceletL:this.inventory.equipment.braceletL?.id||null,
braceletR:this.inventory.equipment.braceletR?.id||null
},

typeLimits:this.inventory.typeLimits,
time:Date.now()
};
}
applySaveData(data){
if(!data)return false;
this.inventory.items=Array.isArray(data.items)?data.items.map(i=>{if(!i.displayName)i.displayName=i.name;return i;}):[];
if(data.typeLimits)this.inventory.typeLimits=data.typeLimits;
this.inventory.weapon=this.inventory.items.find(i=>i.id===data.weaponId)||null;
this.inventory.armor=this.inventory.items.find(i=>i.id===data.armorId)||null;
this.inventory.magic=this.inventory.items.find(i=>i.id===data.magicId)||null;

if(data.equipment){
for(const slot of EquipmentData.currentSlots){
const savedId=data.equipment[slot];

this.inventory.equipment[slot]=
savedId
? this.inventory.items.find(i=>i.id===savedId)||null
: null;
}

if(this.inventory.equipment.ringL&&this.inventory.equipment.ringL.type!=="ring"){
this.inventory.equipment.ringL=null;
}

if(this.inventory.equipment.ringR&&this.inventory.equipment.ringR.type!=="ring"){
this.inventory.equipment.ringR=null;
}

if(
this.inventory.equipment.ringL &&
this.inventory.equipment.ringR &&
this.inventory.equipment.ringL.id===this.inventory.equipment.ringR.id
){
this.inventory.equipment.ringR=null;
}

if(this.inventory.equipment.braceletL&&this.inventory.equipment.braceletL.type!=="bracelet"){
this.inventory.equipment.braceletL=null;
}

if(this.inventory.equipment.braceletR&&this.inventory.equipment.braceletR.type!=="bracelet"){
this.inventory.equipment.braceletR=null;
}

if(
this.inventory.equipment.braceletL &&
this.inventory.equipment.braceletR &&
this.inventory.equipment.braceletL.id===this.inventory.equipment.braceletR.id
){
this.inventory.equipment.braceletR=null;
}

this.inventory.weapon=this.inventory.equipment.weapon||this.inventory.weapon;
this.inventory.armor=this.inventory.equipment.armor||this.inventory.armor;
this.inventory.magic=this.inventory.equipment.magic||this.inventory.magic;

this.inventory.equipment.weapon=this.inventory.weapon;
this.inventory.equipment.armor=this.inventory.armor;
this.inventory.equipment.magic=this.inventory.magic;
}

this.inventory.trimAll();
if(data.player){
this.player.x=clamp(data.player.x||800,10,CONFIG.worldW-10);
this.player.y=clamp(data.player.y||600,10,CONFIG.worldH-10);
this.player.hp=clamp(data.player.hp||100,0,this.player.maxHp||100);
this.player.gold=data.player.gold||0;
this.player.herb=data.player.herb||0;
}
this.ui.refreshInventory();
this.camera.follow(this.player);
return true;
}
saveGame(label="SAVE"){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(SaveSystem.save(this)));
this.addLog(`${label} 完了`);
return true;
}catch(e){
this.addLog("SAVE失敗");
return false;
}
}
manualSave(){this.saveGame("SAVE")}
autoSave(){this.saveGame("AUTO SAVE")}
loadGame(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw){this.addLog("SAVEデータなし");return false}
const data=JSON.parse(raw);
if(this.applySaveData(data)){this.addLog("LOAD 完了");return true}
}catch(e){}
this.addLog("LOAD失敗");
return false;
}
tryLoadOnStart(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw)return;
const data=JSON.parse(raw);
if(this.applySaveData(data))this.addLog("前回SAVE読込");
}catch(e){}
}
restartGame(){
try{localStorage.removeItem(SAVE_KEY)}catch(e){}
this.inventory=new Inventory();
this.player=new Player();
this.enemies=[];
this.projectiles=[];
this.enemyProjectiles=[];
this.effects=[];
this.drops=[];
this.logs=[];
this.paused=false;
this.menuOpen=false;
this.spawnCooldown=0;
this.testRangeView=false;
this.currentArea=null;
this.currentBgmKey="";
document.getElementById("rangeViewBtn").textContent="攻撃範囲表示 OFF";
this.spawnInitialEnemies();
this.ui.refreshInventory();
this.playerInVillage=this.isInVillage(this.player.x,this.player.y);
this.wasInVillage=this.playerInVillage;
this.camera.follow(this.player);
this.addLog("最初から開始");
}
updatePlayer(){
const beforeVillage=this.playerInVillage;

this.playerInVillage=this.isInVillage(this.player.x,this.player.y);

this.player.update(this);

this.playerInVillage=this.isInVillage(this.player.x,this.player.y);

if(!beforeVillage&&this.playerInVillage)this.autoSave();

if(this.wasInVillage&&!this.playerInVillage)
this.reviveEnemiesFromVillageExit();

this.wasInVillage=this.playerInVillage;

if(this.playerInVillage&&this.player.hp<this.player.maxHp){
this.player.hp=clamp(
this.player.hp+VILLAGE.healRate+stat(this,"hp")*.002,
0,
this.player.maxHp
);
}
}

updateEnemies(){
for(const e of this.enemies)e.update(this);
this.separateUnits();
this.autoSpawnEnemies();
}

separateUnits(){
const p=this.player;

for(const e of this.enemies){
if(!e.alive)continue;

const minDist=p.size/2+e.size/2+4;
const d=Math.max(1,dist(p.x,p.y,e.x,e.y));

if(d<minDist){
const nx=(e.x-p.x)/d;
const ny=(e.y-p.y)/d;
const push=(minDist-d)*0.45;

if(e.bossRank){
e.x+=nx*push*0.15;
e.y+=ny*push*0.15;
p.x-=nx*push*1.15;
p.y-=ny*push*1.15;
}else{
e.x+=nx*push;
e.y+=ny*push;
p.x-=nx*push*0.35;
p.y-=ny*push*0.35;
}
}
}

for(let i=0;i<this.enemies.length;i++){
const a=this.enemies[i];
if(!a.alive)continue;

for(let j=i+1;j<this.enemies.length;j++){
const b=this.enemies[j];
if(!b.alive)continue;

const minDist=a.size/2+b.size/2+3;
const d=Math.max(1,dist(a.x,a.y,b.x,b.y));

if(d<minDist){
const nx=(b.x-a.x)/d;
const ny=(b.y-a.y)/d;
const push=(minDist-d)*0.35;

a.x-=nx*push;
a.y-=ny*push;
b.x+=nx*push;
b.y+=ny*push;
}
}
}

p.x=clamp(p.x,10,CONFIG.worldW-10);
p.y=clamp(p.y,10,CONFIG.worldH-10);

for(const e of this.enemies){
e.x=clamp(e.x,10,CONFIG.worldW-10);
e.y=clamp(e.y,10,CONFIG.worldH-10);
}
}

updateProjectiles(){
for(const p of this.projectiles)p.update(this);
this.projectiles=this.projectiles.filter(p=>p.life>0);
}

updateEnemyProjectiles(){
for(const p of this.enemyProjectiles)p.update(this);
this.enemyProjectiles=this.enemyProjectiles.filter(p=>p.life>0);
}

updateEffects(){
for(const fx of this.effects)fx.update();
this.effects=this.effects.filter(e=>e.life>0);
}

updateDrops(){
for(const e of this.enemies){
if(!e.alive&&!e.dropped){
e.dropped=true;

const goldGain=Math.max(
1,
Math.floor(e.level*0.7+e.bossRank*3+Math.random()*4)
);

this.player.gold=(this.player.gold||0)+goldGain;
this.addLog(`${e.name}から${goldGain}G入手`);

const weaponItem=LootFactory.create(e,this);
weaponItem.type="weapon";

const enemyWeaponMap={
daggerGoblin:"dagger",
goblin:"sword",
spearman:"spear",
greatsword:"greatsword"
};

const fixedKind=enemyWeaponMap[e.type]||"sword";

const tpl=WEAPON_NAMES.find(w=>w.kind===fixedKind)||WEAPON_NAMES[1];

weaponItem.kind=tpl.kind;
weaponItem.name=baseWeaponName(weaponItem.kind,weaponItem.affixes.length);
weaponItem.displayName=affixPrefixName(weaponItem)+weaponItem.name;

this.drops.push(new LootDrop(e.x-10,e.y,weaponItem));
this.addLog(`${e.name}が${weaponItem.displayName||weaponItem.name}を落とした`);

if(Math.random()<.45){
let item=LootFactory.create(e,this);

if(item.type==="weapon"){
item=LootFactory.create(e,this);
}

if(item.type!=="weapon"){
this.drops.push(new LootDrop(e.x+10,e.y,item));
this.addLog(`${e.name}が追加で${item.displayName||item.name}を落とした`);
}
}
}
}

this.drops=this.drops.filter(d=>d.update(this));
}

updateWorld(){
this.camera.follow(this.player);

const area=AreaData.byLocation(this.player.x,this.player.y);

if(!this.currentArea||this.currentArea.key!==area.key){
this.currentArea=area;
this.currentBgmKey=area.bgm;
this.addLog(`${area.name}に入った`);
}
}

updateUI(){
this.ui.update();
}

drawAttackRanges(){
const ctx=this.ctx;
const p=this.player;
const c=this.camera;
ctx.save();
const spec=this.inventory.weaponSpec();
let playerRange=spec.range;
ctx.strokeStyle="rgba(80,180,255,.50)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(c.sx(p.x),c.sy(p.y),playerRange,0,Math.PI*2);
ctx.stroke();
ctx.strokeStyle="rgba(255,80,80,.30)";
ctx.lineWidth=2;
for(const e of this.enemies){
if(!e.alive)continue;
const r=CONFIG.enemySwordRange+(e.bossRank?10:0)+Math.min(25,e.level*.25);
ctx.beginPath();
ctx.arc(c.sx(e.x),c.sy(e.y),r,0,Math.PI*2);
ctx.stroke();
}
ctx.restore();
}
update(){
this.input.updateKeyboardVector();
if(this.input.consume("pauseQueued")){this.paused=!this.paused;document.getElementById("pauseBtn").textContent=this.paused?"▶":"II"}
if(this.input.consume("menuQueued")){this.menuOpen=!this.menuOpen;this.ui.refreshInventory()}
if(this.paused||this.menuOpen){this.ui.update();return}
this.updatePlayer();
this.updateEnemies();
this.updateProjectiles();
this.updateEnemyProjectiles();
this.updateEffects();
this.updateDrops();
this.updateWorld();
this.updateUI();
}
draw(){
const ctx=this.ctx;
ctx.clearRect(0,0,CONFIG.viewW,CONFIG.viewH);
this.world.draw(ctx,this.camera);
if(this.playerInVillage)this.drawVillageBanner();
this.drawAreaName();
for(const d of this.drops)d.draw(ctx,this.camera);
for(const e of this.enemies)e.draw(ctx,this.camera);
for(const p of this.projectiles)p.draw(ctx,this.camera);
for(const p of this.enemyProjectiles)p.draw(ctx,this.camera);
for(const fx of this.effects)fx.draw(ctx,this.camera);
if(this.testRangeView)this.drawAttackRanges();
this.player.draw(ctx,this.camera);
if(this.paused)this.drawOverlay("PAUSE");
if(this.player.hp<=0)this.drawOverlay("GAME OVER");
}
drawOverlay(label){
const ctx=this.ctx;
ctx.fillStyle="rgba(0,0,0,.58)";
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);
ctx.fillStyle="#fff";
ctx.font="36px monospace";
ctx.textAlign="center";
ctx.fillText(label,CONFIG.viewW/2,CONFIG.viewH/2);
ctx.textAlign="left";
}
drawAreaName(){
const area=this.currentArea||AreaData.byLocation(this.player.x,this.player.y);
const ctx=this.ctx;

ctx.fillStyle="rgba(5,7,10,.55)";
ctx.fillRect(12,12,160,30);

ctx.fillStyle="#fff4c7";
ctx.font="13px monospace";
ctx.fillText(area.name,24,32);
}

drawVillageBanner(){
const ctx=this.ctx;
ctx.fillStyle="rgba(255,232,166,.13)";
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);
ctx.fillStyle="rgba(5,7,10,.62)";
ctx.fillRect(CONFIG.viewW/2-130,42,260,34);
ctx.fillStyle="#fff4c7";
ctx.font="14px monospace";
ctx.textAlign="center";
ctx.fillText(`${VILLAGE.name} SAFE`,CONFIG.viewW/2,64);
ctx.textAlign="left";
}
loop(now=0){
if(!this.lastTime)this.lastTime=now;

this.dt=Math.min(
2,
(now-this.lastTime)/16.666
);

this.lastTime=now;

this.update();
this.draw();

requestAnimationFrame(t=>this.loop(t));
}
}
new Game();

</script>
</body>
</html>
