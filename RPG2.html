function segmentHit(ax,ay,bx,by,px,py,r){
const dx=bx-ax,dy=by-ay,lenSq=dx*dx+dy*dy;
if(lenSq===0)return{hit:dist(ax,ay,px,py)<=r,t:0};
const t=clamp(((px-ax)*dx+(py-ay)*dy)/lenSq,0,1);
const cx=ax+dx*t,cy=ay+dy*t;
if(dist(cx,cy,px,py)>r)return{hit:false,t};
return{hit:true,t};
}
function segmentCross(ax,ay,bx,by,cx,cy,dx,dy){
function ccw(px,py,qx,qy,rx,ry){
return (ry-py)*(qx-px)>(qy-py)*(rx-px);
}
return ccw(ax,ay,cx,cy,dx,dy)!==ccw(bx,by,cx,cy,dx,dy)&&
ccw(ax,ay,bx,by,cx,cy)!==ccw(ax,ay,bx,by,dx,dy);
}

function stat(game,name){return game.inventory.sumStat(name)||0}

const CombatSystem={
stat(game,name){
return game.inventory.sumStat(name)||0;
},
calcDamage(game,base,enemy,type){
let dmg=base+this.stat(game,"attack");
if(type==="magic")dmg+=this.stat(game,"magicPower");
if(type==="fire")dmg+=this.stat(game,"fire")+this.stat(game,"magicPower");
if(type==="thunder")dmg+=this.stat(game,"thunder")+this.stat(game,"magicPower");
if(type==="poison")dmg+=this.stat(game,"poison")+this.stat(game,"magicPower");
if(enemy&&enemy.bossRank)dmg+=this.stat(game,"bossDamage");
let critical=false;
if(Math.random()<this.stat(game,"crit")*.01){
critical=true;
dmg=Math.floor(dmg*1.7);
}
return{damage:Math.max(1,Math.floor(dmg)),critical};
},
applyDrain(game,damage){
const v=this.stat(game,"drain");
if(v>0)game.player.hp=clamp(game.player.hp+damage*v*.02,0,game.player.maxHp);
},
applyRegen(game){
const v=this.stat(game,"regen");
if(v>0)game.player.hp=clamp(game.player.hp+v*.015,0,game.player.maxHp);
},
applyBurn(enemy,power){
if(power>0){enemy.burnTime=120+power*5;enemy.burnPower=power}
},
applyPoison(enemy,power,bonus=1){
if(power>0){enemy.poisonTime=(180+power*10)*bonus;enemy.poisonPower=power}
},
applyThunder(game,enemy,power,bonus=1){
if(power<=0)return;
enemy.stunTime=Math.max(enemy.stunTime,(2+power*.2)*bonus);
let chained=0;
for(const e of game.enemies){
if(e!==enemy&&e.alive&&dist(e.x,e.y,enemy.x,enemy.y)<120&&chained<2){
e.takeDamage(Math.max(1,Math.floor(power*.7)));
e.stunTime=Math.max(e.stunTime,2+power*.1);
chained++;
}
}
},
applyIce(enemy,power){
if(power<=0)return;
enemy.slowTime=Math.max(enemy.slowTime,100+power*8);
enemy.slowPower=Math.max(enemy.slowPower,.25+Math.min(.55,power*.015));
enemy.iceStack=(enemy.iceStack||0)+1;
if(enemy.iceStack>=3){
enemy.stunTime=Math.max(enemy.stunTime,40+power*2);
enemy.iceStack=0;
}
},
applyDark(game,enemy,power,damage){
if(power<=0)return;
enemy.darkTime=Math.max(enemy.darkTime,120+power*6);
enemy.darkPower=power;
game.player.hp=clamp(game.player.hp+damage*(power*.004),0,game.player.maxHp);
},
applyLight(game,enemy,power,damage){
if(power<=0)return;
const extra=Math.max(1,Math.floor(damage*(.12+power*.004)));
enemy.takeDamage(extra);
game.player.hp=clamp(game.player.hp+extra*.25,0,game.player.maxHp);
},
applyWind(enemy,power,dx,dy){
if(power<=0)return;
const k=2+power*.18;
enemy.knockback(dx,dy,k);
},
applyElementEffects(game,enemy,damage,dx,dy){
this.applyBurn(enemy,this.stat(game,"fire"));
this.applyPoison(enemy,this.stat(game,"poison"));
this.applyThunder(game,enemy,this.stat(game,"thunder"));
this.applyIce(enemy,this.stat(game,"ice"));
this.applyDark(game,enemy,this.stat(game,"dark"),damage);
this.applyLight(game,enemy,this.stat(game,"light"),damage);
this.applyWind(enemy,this.stat(game,"wind"),dx,dy);
}
};

const DamageSystem={

damageEnemy(enemy,amount){
if(!enemy||!enemy.alive)return;

enemy.hp-=amount;
enemy.hitTimer=8;

if(enemy.hp<=0){
enemy.hp=0;
enemy.alive=false;
}
},

damagePlayer(game,player,amount){
if(!game||!player)return;
if(player.invuln>0)return;

const defense=stat(game,"defense");
const finalDamage=Math.max(1,amount-defense);

player.hp=clamp(
player.hp-finalDamage,
0,
player.maxHp
);

player.invuln=45;
},

healPlayer(player,amount){
if(!player)return;

player.hp=clamp(
player.hp+amount,
0,
player.maxHp
);
}

};

let blocked=false;

if(dist(x,y,h.x,h.y)<90){
blocked=true;
break;
}
}

if(blocked)continue;

for(const n of VILLAGE.npcs){
if(dist(x,y,n.x,n.y)<80){
blocked=true;
break;
}
}

if(blocked)continue;
let ok=true;
for(const t of trees){
if(dist(x,y,t.x,t.y)<CONFIG.treeMinDistance){ok=false;break}
}
if(ok)trees.push({x,y,scale:rand(.75,1.45),tone:rand(0,1)});
}
return trees;
}

queue(e,key){e.preventDefault();this[key]=true}
updatePadRect(){const r=this.pad.getBoundingClientRect();this.centerX=r.left+r.width/2;this.centerY=r.top+r.height/2}
onPadMove(point,e){
e.preventDefault();
let x=point.clientX-this.centerX,y=point.clientY-this.centerY;
const d=Math.hypot(x,y);
if(d>this.maxRadius){x=x/d*this.maxRadius;y=y/d*this.maxRadius}
this.stick.style.transform=`translate(${x}px,${y}px)`;
this.padX=x/this.maxRadius;this.padY=y/this.maxRadius;
this.composeMove();
}
resetPad(){this.stick.style.transform="translate(0,0)";this.padX=0;this.padY=0;this.composeMove()}
onKey(e,down){
const k=e.key.toLowerCase();
if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d","escape","tab"].includes(k))e.preventDefault();
if(down&&k==="escape"){this.pauseQueued=true;return}
if(down&&k==="tab"){this.menuQueued=true;return}
if(down)this.keys.add(k);else this.keys.delete(k);
}
updateKeyboardVector(){
let x=0,y=0;
if(this.keys.has("a")||this.keys.has("arrowleft"))x--;
if(this.keys.has("d")||this.keys.has("arrowright"))x++;
if(this.keys.has("w")||this.keys.has("arrowup"))y--;
if(this.keys.has("s")||this.keys.has("arrowdown"))y++;
if(x||y){const n=Math.hypot(x,y);this.keyX=x/n;this.keyY=y/n}else{this.keyX=0;this.keyY=0}
this.composeMove();
}
composeMove(){if(this.keyX||this.keyY){this.moveX=this.keyX;this.moveY=this.keyY;return}this.moveX=this.padX;this.moveY=this.padY}
consume(key){const v=this[key];this[key]=false;return v}
}

class Inventory{

}

}
limit(type){return this.typeLimits[type]||CONFIG.baseInventoryLimit}
itemsByType(type){return this.items.filter(i=>i.type===type)}
bestItem(type){const list=this.itemsByType(type);if(!list.length)return null;return list.reduce((best,item)=>scoreItem(item)>scoreItem(best)?item:best,list[0])}
fixExtraEquipSlots(){
for(const slot of AUTO_EQUIP_SLOTS){
const current=this.equipment[slot];

if(
current &&
(
current.type!==slot ||
!this.items.some(i=>i.id===current.id)
)
){
this.equipment[slot]=null;
}

if(!this.equipment[slot]){
this.equipment[slot]=this.bestItem(slot);
}
}
}
add(item){
this.items.unshift(item);

if(item.type==="weapon"){
if(!this.weapon||scoreItem(item)>scoreItem(this.weapon)){
this.weapon=item;
}
}

else if(item.type==="armor"){
if(!this.armor||scoreItem(item)>scoreItem(this.armor)){
this.armor=item;
}
}

else if(item.type==="magic"){
if(!this.magic||scoreItem(item)>scoreItem(this.magic)){
this.magic=item;
}
}

else if(AUTO_EQUIP_SLOTS.includes(item.type)){
if(!this.equipment[item.type]||scoreItem(item)>scoreItem(this.equipment[item.type])){
this.equipment[item.type]=item;
}
}

this.trimByType(item.type);
this.fixEquips();
}
trimByType(type){
let list=this.itemsByType(type);
const limit=this.limit(type);
while(list.length>limit){
const removable=list.filter(
item=>!this.isEquipped(item)&&!item.locked
);
if(!removable.length){
break;
}

const targetList=removable;
const weakest=targetList.reduce((w,item)=>scoreItem(item)<scoreItem(w)?item:w,targetList[0]);

if(!weakest)break;

this.items=this.items.filter(i=>i.id!==weakest.id);

if(this.weapon&&this.weapon.id===weakest.id)this.weapon=null;
if(this.armor&&this.armor.id===weakest.id)this.armor=null;
if(this.magic&&this.magic.id===weakest.id)this.magic=null;

for(const slot of EquipmentData.currentSlots){
if(
this.equipment[slot] &&
this.equipment[slot].id===weakest.id
){
this.equipment[slot]=null;
}
}

list=this.itemsByType(type);
}
}
trimAll(){
for(const type of [
"weapon",
"armor",
"magic",
"head",
"arm",
"waist",
"leg",
"neck",
"ring",
"bracelet"
]){
this.trimByType(type);
}

this.fixEquips();
}
fixEquips(){
for(const slot of EquipmentData.currentSlots){
const item=this.equipment[slot];

if(!item){
continue;
}

if(!this.items.some(i=>i.id===item.id)){
this.equipment[slot]=null;
continue;
}

if(slot==="ringL"||slot==="ringR"){
if(item.type!=="ring")this.equipment[slot]=null;
continue;
}

if(slot==="braceletL"||slot==="braceletR"){
if(item.type!=="bracelet")this.equipment[slot]=null;

}

if(item.type!==slot){
this.equipment[slot]=null;
}
}

const usedIds=new Set();

for(const slot of EquipmentData.currentSlots){
const item=this.equipment[slot];

if(!item)continue;

if(usedIds.has(item.id)){
this.equipment[slot]=null;
continue;
}

usedIds.add(item.id);
}

if(!this.weapon || !this.items.some(i=>i.id===this.weapon.id) || this.weapon.type!=="weapon"){
this.weapon=this.equipment.weapon;
}

if(!this.armor || !this.items.some(i=>i.id===this.armor.id) || this.armor.type!=="armor"){
this.armor=this.equipment.armor;
}

if(!this.magic || !this.items.some(i=>i.id===this.magic.id) || this.magic.type!=="magic"){
this.magic=this.equipment.magic;
}

if(!this.weapon)this.weapon=this.bestItem("weapon");
if(!this.armor)this.armor=this.bestItem("armor");
if(!this.magic)this.magic=this.bestItem("magic");

this.equipment.weapon=this.weapon;
this.equipment.armor=this.armor;
this.equipment.magic=this.magic;

this.fixExtraEquipSlots();
}
equip(id){

weaponSpec(){

class LootFactory{
static create(enemy,game){
const type=this.rollType();
const luck=game?stat(game,"luck"):0;
const rarity=this.rollRarity(enemy,game,luck);
const level=enemy.level;
const affixCount=this.rollAffixCount(type,enemy,luck);
const tpl=this.templateByType(type);
const base=this.basePower(type,level,enemy);

const item={
id:uid(),
locked:false,
type,
level,
rarity,
kind:tpl.kind,
name:tpl.name||tpl.label||"",
displayName:tpl.name||tpl.label||"",
basePower:Math.round(base*rarity.bonus),
affixes:this.makeAffixes(type,affixCount,enemy,rarity)
};

this.applyDisplayName(item);

return item;
}

static rollType(){
const roll=Math.random();
if(roll<.30)return "weapon";
if(roll<.50)return "armor";
if(roll<.62)return "head";
if(roll<.74)return "arm";
if(roll<.84)return "waist";
if(roll<.92)return "leg";
if(roll<.95)return "neck";
if(roll<.98)return "ring";
return "bracelet";
}

static rollAffixCount(type,enemy,luck){
const level=enemy.level;
let count=enemy.bossRank>0
?Math.min(6,Math.ceil(enemy.bossRank/8))
:randInt(0,Math.min(3,Math.floor(level/4)));

if(type==="magic")count=Math.max(1,count);
if(Math.random()<luck*.02)count++;
if(enemy.distanceRate>=.9&&enemy.bossRank>0)count=Math.max(count,4);

return Math.min(6,count);
}

static basePower(type,level,enemy){
const baseByType={
weapon:5,
armor:4,
head:3,
arm:3,
waist:3,
leg:3,
neck:4,
ring:4,
bracelet:4,
magic:6
};

return Math.round(
(baseByType[type]||6)
+level*rand(1.2,2.2)
+enemy.bossRank*rand(4,8)
);
}

static templateByType(type){
const table={
weapon:WEAPON_NAMES,
armor:ARMOR_NAMES,
magic:MAGIC_NAMES,
head:HEAD_NAMES,
arm:ARM_NAMES,
waist:WAIST_NAMES,
leg:LEG_NAMES,
neck:NECK_NAMES,
ring:RING_NAMES,
bracelet:BRACELET_NAMES
};

return choose(table[type]||WEAPON_NAMES);
}

static makeAffixes(type,count,enemy,rarity){
const affixes=[];
const used=new Set();

for(let i=0;i<count;i++){
let pool=AFFIX_POOL.filter(a=>!used.has(a.name));

if(type==="magic"){
pool=pool.filter(a=>[
"fire",
"thunder",
"poison",
"ice",
"dark",
"light",
"wind",
"magicPower",
"magicSpeed",
"crit",
"luck",
"drain",
"regen",
"bossDamage"
].includes(a.stat));

if(!pool.length)pool=AFFIX_POOL.filter(a=>!used.has(a.name));
}

const a=choose(pool.length?pool:AFFIX_POOL);
used.add(a.name);

let value=Math.round(
rand(a.min,a.max)*
(1+enemy.level/12)*
(1+enemy.bossRank/10)*
rarity.bonus
);

if(enemy.distanceRate>=.9&&enemy.bossRank>0)value=Math.round(value*1.25);

affixes.push({name:a.name,stat:a.stat,value});
}

return affixes;
}

static applyDisplayName(item){
if(item.type==="weapon"){
item.name=baseWeaponName(item.kind,item.affixes.length);
item.displayName=affixPrefixName(item)+item.name;
}

else{
item.name=baseEquipName(item.type,item.affixes.length);
item.displayName=affixPrefixName(item)+item.name;
}
}

static rollRarity(enemy,game,luck){
const rate=enemy.distanceRate||0;
const boss=enemy.bossRank||0;
const r=Math.random();
let legendary=0,epic=0,rare=0;
if(rate<.30){
legendary=0;
epic=.02+luck*.0008;
rare=.22+rate*.35+luck*.002;
}else if(rate<.70){
legendary=.002+(rate-.30)*.025+boss*.0008+luck*.001;
epic=.08+(rate-.30)*.28+boss*.002+luck*.002;
rare=.34+(rate-.30)*.18+luck*.002;
}else if(rate<.90){
legendary=.015+(rate-.70)*.18+boss*.0025+luck*.0015;
epic=.22+(rate-.70)*.38+boss*.003+luck*.002;
rare=.42+luck*.001;
}else{
legendary=.10+(rate-.90)*1.6+boss*.006+luck*.002;
epic=.36+(rate-.90)*.5+boss*.002+luck*.0015;
rare=.36;
}
if(rate<.30)legendary=0;
legendary=clamp(legendary,0,.42);
epic=clamp(epic,0,.55);
rare=clamp(rare,0,.62);
if(r<legendary)return RARITIES[3];
if(r<legendary+epic)return RARITIES[2];
if(r<legendary+epic+rare)return RARITIES[1];
return RARITIES[0];
}
}
class Player{
constructor(){
this.x=800;this.y=600;this.size=24;this.hp=100;this.maxHp=100;
this.gold=0;
this.herb=0;
this.materials={
"鉄くず":0,
"毛皮":0,
"糸":0,
"石材":0
};
this.dirX=0;this.dirY=1;this.invuln=0;this.attackTimer=0;this.attackCooldown=0;this.magicTimer=0;
this.weaponDurability=100;
this.attackHitIds=new Set();this.swordX=this.x;this.swordY=this.y;
}
update(game){
const input=game.input;
let mx=input.moveX,my=input.moveY;
this.maxHp=CONFIG.baseHp+stat(game,"hp")*8;
this.hp=clamp(this.hp,0,this.maxHp);
const speedStat=stat(game,"speed");

const speedBonus=(1.0*speedStat)/(speedStat+100);

const speed=Math.min(
3.0,
2.0+speedBonus
);
const dt=this.dt||1;

this.x=clamp(
this.x+mx*speed*dt,
10,
CONFIG.worldW-10
);

this.y=clamp(
this.y+my*speed*dt,
10,
CONFIG.worldH-10
);
if(mx||my){this.dirX=mx;this.dirY=my}
if(this.invuln>0)this.invuln--;
if(this.attackCooldown>0)this.attackCooldown--;
if(this.magicTimer>0)this.magicTimer--;

if(this.poisonTime>0){
this.poisonTime--;
if(this.poisonTime%30===0){
this.hp=clamp(this.hp-(this.poisonPower||1),0,this.maxHp);
}
}

applyRegen(game);
let target=null,min=360;
for(const e of game.enemies){
if(!e.alive)continue;
const d=dist(this.x,this.y,e.x,e.y);
if(d<min){min=d;target=e}
}
if(target&&!game.paused&&!game.menuOpen&&!game.playerInVillage){
const a=Math.atan2(target.y-this.y,target.x-this.x);
this.dirX=Math.cos(a);this.dirY=Math.sin(a);
const spec=game.inventory.weaponSpec();
const meleeRange=spec.range+target.size/2+12;
if(min<=meleeRange&&this.attackTimer<=0&&this.attackCooldown<=0)this.startAttack(game);
if(false&&this.magicTimer<=0){
game.castMagic();
this.magicTimer=Math.max(90,180-Math.floor((stat(game,"speed")+stat(game,"magicSpeed"))*.6));
}
}
if(this.attackTimer>0)this.updateAttack(game);
}
startAttack(game){
if(game.playerInVillage||game.nearCamp){
return;
}

const spec=game.inventory.weaponSpec();

const weaponItem=game.inventory.equipment.weapon;

if(weaponItem){
if(weaponItem.durability==null)weaponItem.durability=100;

weaponItem.durability=clamp(
weaponItem.durability-0.2,
0,
100
);

if(
weaponItem.durability<=0 &&
!weaponItem.locked
){
game.spawnAffixBurst(
this.x,
this.y,
"crit"
);

game.addLog(
`${weaponItem.displayName||weaponItem.name} が壊れた`
);

game.inventory.items=
game.inventory.items.filter(
i=>i.id!==weaponItem.id
);

game.inventory.weapon=null;
game.inventory.equipment.weapon=null;

game.inventory.fixEquips();
}
}

this.attackTotal=Math.max(10,spec.duration*2-Math.floor(stat(game,"speed")*.01));
this.attackTimer=this.attackTotal;
this.attackHitIds.clear();
}
updateAttack(game){
const spec=game.inventory.weaponSpec();
this.attackTimer--;

const angle=Math.atan2(this.dirY,this.dirX);
const total=Math.max(1,this.attackTotal||spec.duration);
const swing=clamp((total-this.attackTimer)/total,0,1);

let swordAngle=angle;
let len=spec.range;

let spearCanHit=true;

if(spec.key==="spear"){
const thrust=swing<0.5
? len*(swing/0.5)
: len*(1-(swing-0.5)/0.5);

spearCanHit=swing<0.5;

this.swordX=this.x+Math.cos(angle)*thrust;
this.swordY=this.y+Math.sin(angle)*thrust;
}else{
swordAngle=angle-spec.arc/2+swing*spec.arc;
this.swordX=this.x+Math.cos(swordAngle)*len;
this.swordY=this.y+Math.sin(swordAngle)*len;
}

for(const enemy of game.enemies){
if(!enemy.alive)continue;
if(enemy.attackPhase!=="active")continue;

const enemyLen=CONFIG.enemySwordRange+(enemy.bossRank?18:0)+Math.min(30,enemy.level*.28);
const enemyTotal=CONFIG.enemySwordActive;
const enemyProgress=clamp((enemyTotal-enemy.attackTimer)/enemyTotal,0,1);

const enemyBaseAngle=Math.atan2(enemy.attackDirY,enemy.attackDirX);
const enemyArc=enemy.bossRank?2.4:2.0;
const enemySwordAngle=enemyBaseAngle-enemyArc/2+enemyProgress*enemyArc;

const ex1=enemy.x;
const ey1=enemy.y;
const ex2=enemy.x+Math.cos(enemySwordAngle)*enemyLen;
const ey2=enemy.y+Math.sin(enemySwordAngle)*enemyLen;

if(segmentCross(this.x,this.y,this.swordX,this.swordY,ex1,ey1,ex2,ey2)){
const d=Math.max(1,dist(this.x,this.y,enemy.x,enemy.y));
const nx=(this.x-enemy.x)/d;
const ny=(this.y-enemy.y)/d;
const clashPower=10;

this.x+=nx*clashPower*.55;
this.y+=ny*clashPower*.55;
enemy.knockback(-nx,-ny,clashPower);

enemy.clashFlash=8;
enemy.attackTimer=Math.max(enemy.attackTimer,6);
enemy.attackPhase="active";
this.attackTimer=Math.max(this.attackTimer,6);

const weaponItem=game.inventory.equipment.weapon;

if(weaponItem){
if(weaponItem.durability==null)weaponItem.durability=100;

weaponItem.durability=clamp(
weaponItem.durability-3,
0,
100
);
}

game.spawnAffixBurst(
(this.x+enemy.x)/2,
(this.y+enemy.y)/2,
"melee"
);

game.addLog("武器同士がぶつかった");
return;
}
}

let hitCount=0;

for(const enemy of game.enemies){
if(hitCount>=2)break;
if(!enemy.alive||this.attackHitIds.has(enemy.id))continue;

let hitAx=this.x;
let hitAy=this.y;
let hitBx=this.swordX;
let hitBy=this.swordY;

if(spec.key==="spear"){
const dx=this.swordX-this.x;
const dy=this.swordY-this.y;
const d=Math.max(1,Math.hypot(dx,dy));
const nx=dx/d;
const ny=dy/d;

hitAx=this.swordX-nx*22;
hitAy=this.swordY-ny*22;
hitBx=this.swordX+nx*4;
hitBy=this.swordY+ny*4;
}

if(spec.key==="spear"&&!spearCanHit)continue;

const check=segmentHit(
hitAx,
hitAy,
hitBx,
hitBy,
enemy.x,
enemy.y,
enemy.size/2+8
);

if(!check.hit)continue;

let attackPower=CONFIG.swordDamage+spec.damage;

const weaponItem=game.inventory.equipment.weapon;

if(
weaponItem &&
weaponItem.locked &&
(weaponItem.durability??100)<=0
){
attackPower=1;
}

const r=calcDamage(game,attackPower,enemy,"melee");

enemy.takeDamage(r.damage);
this.attackHitIds.add(enemy.id);
hitCount++;

enemy.knockback(
this.dirX,
this.dirY,
(spec.knock||2)+stat(game,"attack")*.05
);

applyElementEffects(game,enemy,r.damage,this.dirX,this.dirY);
applyDrain(game,r.damage);

game.spawnAffixBurst(
enemy.x,
enemy.y,
r.critical?"crit":"melee"
);

game.addLog(`${enemy.name}に${r.damage}${r.critical?" CRIT":""}`);
}

if(this.attackTimer<=0){
this.attackTimer=0;
this.attackCooldown=
spec.key==="spear"
? Math.max(10,Math.floor(spec.duration*.75))
: Math.max(6,Math.floor(spec.duration*.45));
}
}

class Enemy{

update(game){
if(!this.alive)return;
if(this.clashFlash>0)this.clashFlash--;

let target=game.player;
let targetIsAlly=false;

if(game.camps){

}

const enemyWeapon=this.enemyWeaponSpec();

this.type==="golem" ? 120 :
180;

if(this.bossRank)visionRange*=2;

if(this.type==="spider"&&!game.playerInVillage&&this.attackTimer<=0&&!targetIsAlly){

const allyDefense=

Math.floor((target.head?.basePower||0)/16);

const damage=Math.max(

Math.floor(6+this.level*.35+(this.bossRank?this.bossRank*.25:0))-allyDefense
);

200+
Math.floor((target.head?.basePower||0)/2)+
Math.floor((target.armor?.basePower||0)/3);

if(!game.playerInVillage&&d<420&&d>26&&this.attackTimer<=0){

if(
!targetIsAlly &&
this.type!=="spider" &&
d<this.size/2+10 &&
this.attackTimer<=0
){
game.player.takeDamage(touchDamage,game);
}

if(this.hitTimer>0)this.hitTimer--;
if(this.slowTime>0)this.slowTime--;
if(this.darkTime>0)this.darkTime--;
}

if(dist(this.x,this.y,enemy.x,enemy.y)<enemy.size/2+8){
const m=this.magic;
const base=Math.floor(CONFIG.fireDamage*m.damageRate+game.inventory.magicBonus());
const r=calcDamage(game,base,enemy,m.key);
enemy.takeDamage(r.damage);
if(m.key==="fire")applyBurn(enemy,stat(game,"fire")+stat(game,"magicPower"));
if(m.key==="thunder")applyThunder(game,enemy,stat(game,"thunder")+stat(game,"magicPower"),1.35);
if(m.key==="poison")applyPoison(enemy,stat(game,"poison")+stat(game,"magicPower"),1.8);
applyIce(enemy,stat(game,"ice"));
applyDark(game,enemy,stat(game,"dark"),r.damage);
applyLight(game,enemy,stat(game,"light"),r.damage);
applyDrain(game,r.damage);
this.life=0;
game.spawnAffixBurst(enemy.x,enemy.y,r.critical?"crit":"magic");
game.addLog(`${enemy.name}に${m.label}${r.damage}${r.critical?" CRIT":""}`);
break;
}
}
}
draw(ctx,c){
const x=c.sx(this.x),y=c.sy(this.y),m=this.magic;
ctx.fillStyle=m.color;
ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
ctx.fillStyle=m.inner;
ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
}
}
class VisualEffect{
constructor(x,y,affix,mode){
this.x=x;this.y=y;this.color=AFFIX_VISUALS[affix.stat]||"#fff";this.life=mode==="crit"?34:24;this.maxLife=this.life;this.p=[];
const count=mode==="crit"?24:10;
for(let i=0;i<count;i++){
const a=rand(0,Math.PI*2),pow=rand(.6,3.2);
this.p.push({x:x+rand(-8,8),y:y+rand(-8,8),vx:Math.cos(a)*pow,vy:Math.sin(a)*pow-rand(.1,1.2),r:rand(2,6)});
}
}
update(){this.life--;for(const p of this.p){p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94}return this.life>0}
draw(ctx,c){
ctx.save();
ctx.globalAlpha=clamp(this.life/this.maxLife,0,1);
ctx.fillStyle=this.color;
for(const p of this.p){ctx.beginPath();ctx.arc(c.sx(p.x),c.sy(p.y),p.r,0,Math.PI*2);ctx.fill()}
ctx.restore();
}
}
class LootDrop{
constructor(x,y,item){this.x=x;this.y=y;this.item=item;this.pulse=Math.random()*Math.PI*2}
update(game){
this.pulse+=.08;
if(dist(this.x,this.y,game.player.x,game.player.y)<CONFIG.pickupRange){
game.inventory.add(this.item);

game.ui.refreshInventory();
return false;
}
return true;
}
draw(ctx,c){

const item=this.item;
const n=item.affixes.length;

"#44cc66",
"#3399ff",
"#ff4444",
"#ffffff",
"#ff9900",
"#ff66cc",
"#050505"
];

let color=colors[Math.max(0,Math.min(7,n-1))];

if(n>=10){

"#ff4444",
"#ff9900",
"#ffff55",
"#44cc66",
"#3399ff",
"#aa66ff",
"#ff66cc"
];

}

ctx.save();
ctx.fillStyle=color;
ctx.strokeStyle="#111";

if(item.type==="weapon"){

ctx.stroke();
}

else if(item.type==="armor"){

}

else if(item.type==="magic"){

ctx.strokeRect(x-9,y-11,18,22);

ctx.fillRect(x-4,y-7,8,14);
}

else if(item.type==="head"){
ctx.beginPath();
ctx.moveTo(x,y-12);
ctx.lineTo(x+11,y+9);
ctx.lineTo(x-11,y+9);
ctx.closePath();
ctx.fill();
ctx.stroke();
}

else if(item.type==="arm"){
ctx.fillRect(x-14,y-5,10,10);
ctx.fillRect(x+4,y-5,10,10);
ctx.strokeRect(x-14,y-5,10,10);
ctx.strokeRect(x+4,y-5,10,10);
}

else if(item.type==="waist"){
ctx.fillRect(x-14,y-4,28,8);
ctx.strokeRect(x-14,y-4,28,8);
}

else if(item.type==="leg"){
ctx.beginPath();
ctx.arc(x,y,11,Math.PI,0);
ctx.lineTo(x+7,y+9);
ctx.lineTo(x-7,y+9);
ctx.closePath();
ctx.fill();
ctx.stroke();
}

else if(item.type==="neck"){
ctx.beginPath();
ctx.moveTo(x,y-12);
ctx.lineTo(x+11,y);
ctx.lineTo(x,y+12);
ctx.lineTo(x-11,y);
ctx.closePath();
ctx.fill();
ctx.stroke();
}

else if(item.type==="ring"){
ctx.beginPath();
ctx.arc(x,y,11,0,Math.PI*2);
ctx.strokeStyle=color;
ctx.lineWidth=4;
ctx.stroke();
ctx.strokeStyle="#111";
ctx.lineWidth=1;
ctx.stroke();
}

else if(item.type==="bracelet"){
ctx.beginPath();
ctx.arc(x,y,12,0,Math.PI*2);
ctx.strokeStyle=color;
ctx.lineWidth=4;
ctx.stroke();
ctx.beginPath();
ctx.arc(x,y,6,0,Math.PI*2);
ctx.stroke();
ctx.strokeStyle="#111";
ctx.lineWidth=1;
ctx.stroke();
}

else{

ctx.stroke();

ctx.restore();
}
}
class World{
constructor(){
this.trees=makeVisualTrees();
}

draw(ctx,c){
ctx.fillStyle="#000000";
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);

const mapX=c.sx(0);
const mapY=c.sy(0);
const mapW=CONFIG.worldW*c.zoom;
const mapH=CONFIG.worldH*c.zoom;

const area=globalThis.game
?AreaData.byLocation(globalThis.game.player.x,globalThis.game.player.y)
:AreaData.zones[0];

const groundColors={
village:"#2f4a2f",
field:"#2f5a35",
forest:"#1f4a2c",
deepForest:"#17351f",
poison:"#2f2445",
rock:"#45413a",
deep:"#181820"
};

ctx.fillStyle=groundColors[area.key]||"#203820";
ctx.fillRect(mapX,mapY,mapW,mapH);

this.drawGroundNoise(ctx);
this.drawAreaGroundEffects(ctx,c,area);

this.drawVillage(ctx,c);

for(const t of this.trees){
this.drawTree(ctx,c,t,area);
}

this.drawAreaFrontEffects(ctx,c,area);
}

drawAreaGroundEffects(ctx,c,area){
if(!area)return;

if(area.key==="forest"||area.key==="deepForest"){
this.drawForestShade(ctx,area.key==="deepForest"?0.18:0.08);
}

if(area.key==="poison"){
this.drawPoisonMist(ctx);
}

if(area.key==="rock"){
this.drawRocks(ctx,c);
}

if(area.key==="deep"){
this.drawDeepFog(ctx);
}
}

drawAreaFrontEffects(ctx,c,area){
if(!area)return;

if(area.key==="deepForest"){
this.drawForestShade(ctx,0.16);
}

if(area.key==="poison"){
this.drawPoisonMistFront(ctx);
}

if(area.key==="deep"){
this.drawDeepRedFog(ctx);
}
}

drawForestShade(ctx,alpha){
ctx.fillStyle=`rgba(0,0,0,${alpha})`;
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);
}

drawPoisonMist(ctx){
const t=performance.now()*0.001;

for(let i=0;i<18;i++){
const x=(i*91+t*24)%CONFIG.viewW;
const y=(i*47+Math.sin(t+i)*18)%CONFIG.viewH;

ctx.fillStyle="rgba(160,80,220,.08)";
ctx.beginPath();
ctx.arc(x,y,45+Math.sin(t+i)*12,0,Math.PI*2);
ctx.fill();
}
}

drawPoisonMistFront(ctx){
const t=performance.now()*0.001;

for(let i=0;i<9;i++){
const x=(i*137-t*18)%CONFIG.viewW;
const y=(i*73+Math.cos(t+i)*14)%CONFIG.viewH;

ctx.fillStyle="rgba(190,120,255,.10)";
ctx.beginPath();
ctx.arc(x,y,28+Math.sin(t*2+i)*8,0,Math.PI*2);
ctx.fill();
}
}

drawRocks(ctx,c){
for(let i=0;i<36;i++){
const wx=(i*421)%CONFIG.worldW;
const wy=(i*283)%CONFIG.worldH;
const x=c.sx(wx);
const y=c.sy(wy);

if(x<-40||x>CONFIG.viewW+40||y<-40||y>CONFIG.viewH+40)continue;

const s=8+(i%5)*3;

ctx.fillStyle="#55514b";
ctx.beginPath();
ctx.moveTo(x-s,y+s);
ctx.lineTo(x-s*.3,y-s);
ctx.lineTo(x+s,y-s*.4);
ctx.lineTo(x+s*.8,y+s*.8);
ctx.closePath();
ctx.fill();

ctx.strokeStyle="rgba(0,0,0,.35)";
ctx.stroke();
}
}

drawDeepFog(ctx){
const t=performance.now()*0.001;

ctx.fillStyle="rgba(0,0,0,.22)";
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);

for(let i=0;i<12;i++){
const x=(i*101+t*11)%CONFIG.viewW;
const y=(i*67+Math.sin(t+i)*16)%CONFIG.viewH;

ctx.fillStyle="rgba(80,20,30,.10)";
ctx.beginPath();
ctx.arc(x,y,60+Math.sin(t+i)*20,0,Math.PI*2);
ctx.fill();
}
}

drawDeepRedFog(ctx){
const t=performance.now()*0.001;

for(let i=0;i<8;i++){
const x=(i*149-t*20)%CONFIG.viewW;
const y=(i*91+Math.cos(t+i)*20)%CONFIG.viewH;

ctx.fillStyle="rgba(180,35,45,.12)";
ctx.beginPath();
ctx.arc(x,y,42+Math.sin(t*1.4+i)*14,0,Math.PI*2);
ctx.fill();
}
}

drawGroundNoise(ctx){
ctx.fillStyle="rgba(255,255,255,.025)";
for(let i=0;i<28;i++){
const x=(i*97+performance.now()*0)%CONFIG.viewW;
const y=(i*53)%CONFIG.viewH;
ctx.fillRect(x,y,2,2);
}
}

drawVillage(ctx,c){
const x=c.sx(VILLAGE.x),y=c.sy(VILLAGE.y),r=VILLAGE.radius;
ctx.fillStyle="rgba(176,145,88,.55)";
ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
ctx.strokeStyle="rgba(255,232,166,.38)";
ctx.beginPath();ctx.arc(x,y,r*.93,0,Math.PI*2);ctx.stroke();
for(const h of VILLAGE.houses)this.drawHouse(ctx,c,h);
for(const n of VILLAGE.npcs)this.drawNpc(ctx,c,n);
ctx.fillStyle="#fff4c7";
ctx.font="12px monospace";
ctx.textAlign="center";
ctx.fillText(VILLAGE.name,x,y-r*.78);
ctx.textAlign="left";
}

drawHouse(ctx,c,h){
const x=c.sx(h.x),y=c.sy(h.y);
ctx.fillStyle=h.wall;
ctx.fillRect(x-h.w/2,y-h.h/2,h.w,h.h);
ctx.fillStyle=h.roof;
ctx.beginPath();
ctx.moveTo(x-h.w/2-8,y-h.h/2+4);
ctx.lineTo(x,y-h.h/2-32);
ctx.lineTo(x+h.w/2+8,y-h.h/2+4);
ctx.closePath();ctx.fill();
ctx.fillStyle="#442915";
ctx.fillRect(x-9,y+h.h/2-25,18,25);
}

drawNpc(ctx,c,n){
const x=c.sx(n.x),y=c.sy(n.y);

ctx.fillStyle=n.color;
ctx.fillRect(x-6,y-5,12,16);

ctx.fillStyle="#f0c090";
ctx.fillRect(x-5,y-14,10,9);

ctx.fillStyle="#fff";
ctx.font="10px monospace";
ctx.textAlign="center";
ctx.fillText(n.label,x,y-20);

const game=globalThis.game;

if(
game &&
dist(game.player.x,game.player.y,n.x,n.y)<60
){

let msg="こんにちは";

if(n.label==="Inn"){
msg="薬草売ってるよ！";
}

if(n.label==="Shop"){
msg="素材買取るよ！";
}

if(n.label==="Smith"){
msg="鍛冶屋だよ！";
}

ctx.font="11px monospace";

const w=Math.max(90,msg.length*14);

ctx.fillStyle="rgba(0,0,0,.75)";
ctx.fillRect(
x-w/2,
y-52,
w,
18
);

ctx.strokeStyle="#ffffff";
ctx.strokeRect(
x-w/2,
y-52,
w,
18
);

ctx.fillStyle="#fff4c7";
ctx.fillText(
msg,
x,
y-40
);
}

ctx.textAlign="left";
}

drawTree(ctx,c,t,area){

if(dist(t.x,t.y,VILLAGE.x,VILLAGE.y)<VILLAGE.radius-20){
return;
}

const x=c.sx(t.x),y=c.sy(t.y);
if(x<-50||x>CONFIG.viewW+50||y<-70||y>CONFIG.viewH+70)return;

const s=t.scale||1;

ctx.fillStyle="#4b2a14";
ctx.fillRect(x-5*s,y,10*s,20*s);

let leafA=t.tone>.5?"#1b7c3c":"#157336";
let leafB=t.tone>.5?"#2aa050":"#1d9145";

if(area&&area.key==="deepForest"){
leafA="#0f3a22";
leafB="#14502b";
}

if(area&&area.key==="poison"){
leafA="#3b2555";
leafB="#57307a";
}

if(area&&area.key==="deep"){
leafA="#161820";
leafB="#24202a";
}

ctx.fillStyle=leafA;
ctx.fillRect(x-18*s,y-22*s,36*s,26*s);

ctx.fillStyle=leafB;
ctx.fillRect(x-12*s,y-34*s,24*s,20*s);
}
}

renderGroup(game,label,type){
const inv=game.inventory;
const limit=inv.limit(type);
const list=this.sortedItems(game,type);
let html=`<div class="invGroup"><div class="invGroupTitle">${label} ${list.length}/${limit}</div>`;

for(let i=0;i<limit;i++){
if(list[i])html+=this.renderItem(game,list[i],true);
else html+=`<div class="item-row empty">${label}${i+1} 空き</div>`;
}

html+="</div>";
return html;
},

itemBaseLabel(item){

item.type==="magic"?"魔力":

},

itemKindLabel(item){

bindSwipeDrop(game,row){
let startX=0;
let startY=0;
let currentX=0;
let swiping=false;

row.addEventListener("touchstart",e=>{
if(!e.touches||e.touches.length!==1)return;

startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
currentX=0;
swiping=false;
row.dataset.swiped="0";
row.style.transition="";
},{passive:true});

row.addEventListener("touchmove",e=>{
if(!e.touches||e.touches.length!==1)return;

const dx=e.touches[0].clientX-startX;
const dy=e.touches[0].clientY-startY;

if(dx>8&&Math.abs(dx)>Math.abs(dy)*1.25){
swiping=true;
e.preventDefault();

currentX=clamp(dx,0,96);
row.style.transform=`translateX(${currentX}px)`;
row.style.opacity=String(clamp(1-currentX/140,.35,1));
}
},{passive:false});

row.addEventListener("touchend",e=>{
if(!swiping){
row.style.transform="";
row.style.opacity="";
return;
}

if(currentX>=60){
row.dataset.swiped="1";
row.style.transition="transform .12s ease, opacity .12s ease";
row.style.transform="translateX(140px)";
row.style.opacity="0";

setTimeout(()=>{
this.dropById(game,row.dataset.itemId);
game.ui.refreshInventory();
},90);

return;
}

row.style.transition="transform .12s ease, opacity .12s ease";
row.style.transform="";
row.style.opacity="";
},{passive:false});
},

bindInventoryClicks(game){
if(!game||!game.ui)return;
const ui=game.ui;

for(const btn of ui.inventory.querySelectorAll("[data-lock-id]")){
btn.addEventListener("click",e=>{

this.toggleLock(game,btn.dataset.lockId);
ui.refreshInventory();
});
}

for(const row of ui.inventory.querySelectorAll("[data-item-id]")){
this.bindSwipeDrop(game,row);

row.addEventListener("click",()=>{
if(row.dataset.swiped==="1"){
row.dataset.swiped="0";
return;
}

this.equipById(game,row.dataset.itemId);
ui.refreshInventory();
});
}
}

if(area.key==="forest"||area.key==="deepForest"){
squad=[
{type:"wolf",dx:-38,dy:0},
{type:"wolf",dx:0,dy:-8},
{type:"wolf",dx:38,dy:0},
{type:"spider",dx:-24,dy:-76},
{type:"spider",dx:24,dy:-76}
];
}

if(area.key==="rock"||area.key==="deep"){
squad=[
{type:"golem",dx:0,dy:0},
{type:"goblin",dx:-44,dy:18},
{type:"goblin",dx:44,dy:18},
{type:"spider",dx:-30,dy:-82},
{type:"spider",dx:30,dy:-82}
];
}

const d=Math.max(1,dist(x,y,this.player.x,this.player.y));
const fx=(this.player.x-x)/d;
const fy=(this.player.y-y)/d;
const sxSide=-fy;
const sySide=fx;

for(const s of squad){
const front=s.dy||0;
const side=s.dx||0;

const px=x+fx*front+sxSide*side;
const py=y+fy*front+sySide*side;

const ex=clamp(px,80,CONFIG.worldW-80);
const ey=clamp(py,80,CONFIG.worldH-80);

const bossRank=Math.random()<.04?rollBossRank(level):0;
this.enemies.push(new Enemy({x:ex,y:ey,level,bossRank,type:s.type}));
}

this.addLog("敵小隊が隊列を組んで現れた");
},

cleanupEnemies(){
if(this.enemies.length<=CONFIG.maxEnemies)return;
const keep=[];
for(const e of this.enemies){
const d=dist(e.x,e.y,this.player.x,this.player.y);
if(e.alive&&d<CONFIG.activeEnemyRange)keep.push(e);
else if(!e.alive&&d<900)keep.push(e);
}
while(keep.length>CONFIG.maxEnemies)keep.shift();
this.enemies=keep;
},

autoSpawnEnemies(){
if(this.playerInVillage)return;

const px=this.player.x;
const py=this.player.y;

if(this.lastSpawnX===undefined){
this.lastSpawnX=px;
this.lastSpawnY=py;
return;
}

const moved=dist(px,py,this.lastSpawnX,this.lastSpawnY);

if(moved<90)return;

this.lastSpawnX=px;
this.lastSpawnY=py;

const nearEnemies=this.enemies.filter(e=>e.alive&&dist(e.x,e.y,this.player.x,this.player.y)<1000).length;

if(nearEnemies>=CONFIG.targetNearEnemies){
if(this.allies&&this.allies.length<18&&Math.random()<.14){
this.spawnAllyOutsideView();
}
this.cleanupEnemies();
return;
}

let spawned=0;

if(Math.random()<.10){
const before=this.enemies.length;
if(this.spawnSquadOutsideView())spawned+=this.enemies.length-before;
}else{
for(let i=0;i<CONFIG.autoSpawnBatch;i++){
if(this.spawnEnemyOutsideView())spawned++;
}
}

if(!this.allies)this.allies=[];

if(this.allies.length<18&&Math.random()<.14){
this.spawnAllyOutsideView();
}

if(spawned>0)this.addLog(`敵影 ${spawned}`);
this.cleanupEnemies();
}

};

const AllySystem={

gameDropAllyItem(game,x,y,item){
if(!item)return;
game.drops.push(new LootDrop(x,y,item));
},

updateAllies(game){
if(!game.allies)return;

for(const a of game.allies){

if(!a.alive)continue;

if(a.attackCooldown==null){
a.attackCooldown=0;
}

if(a.attackCooldown>0){
a.attackCooldown--;
}

let drop=null;
let dropDist=999999;
const dropSearchRange=260;

for(const d of game.drops){
const roughX=Math.abs(a.x-d.x);
const roughY=Math.abs(a.y-d.y);

if(roughX>dropSearchRange||roughY>dropSearchRange){
continue;
}

const dd=dist(a.x,a.y,d.x,d.y);

if(dd<dropDist){
dropDist=dd;
drop=d;
}
}

if(drop&&dropDist<220){
const dd=Math.max(1,dropDist);

a.x+=(drop.x-a.x)/dd*0.75;
a.y+=(drop.y-a.y)/dd*0.75;

if(dropDist<28){

if(drop.item){

if(drop.item.type==="weapon"){
if(!a.weapon||scoreItem(drop.item)>scoreItem(a.weapon)){
a.weapon=drop.item;
a.name="武装冒険者";
}
}

if(drop.item.type==="armor"){
if(!a.armor||scoreItem(drop.item)>scoreItem(a.armor)){
a.armor=drop.item;
}
}

if(drop.item.type==="head"){
if(!a.head||scoreItem(drop.item)>scoreItem(a.head)){
a.head=drop.item;
}
}

if(drop.item.type==="arm"){
if(!a.arm||scoreItem(drop.item)>scoreItem(a.arm)){
a.arm=drop.item;
}
}

}

drop.pickedByAlly=true;
}

continue;
}

let target=null;
let min=999999;
const enemySearchRange=620;

for(const e of game.enemies){

if(!e.alive)continue;

const roughX=Math.abs(a.x-e.x);
const roughY=Math.abs(a.y-e.y);

if(roughX>enemySearchRange||roughY>enemySearchRange){
continue;
}

const d=dist(a.x,a.y,e.x,e.y);

if(d<min){
min=d;
target=e;
}

}

if(target&&min<520){

const d=Math.max(1,min);

if(min>60){

const speed=0.55;

a.x+=(target.x-a.x)/d*speed;
a.y+=(target.y-a.y)/d*speed;

}else{

if(a.attackCooldown<=0){

const damage=
8+
Math.floor((a.weapon?.basePower||0)/5)+
Math.floor((a.arm?.basePower||0)/10);

target.hitTimer=8;

target.takeDamage(damage);

if(!target.alive){
target.killedByAlly=true;
}

const ad=Math.max(1,dist(a.x,a.y,target.x,target.y));
a.attackAnim=14;
a.attackTotal=14;
a.attackDirX=(target.x-a.x)/ad;
a.attackDirY=(target.y-a.y)/ad;

a.attackCooldown=60;

}

}

}

}

game.drops=game.drops.filter(
d=>!d.pickedByAlly
);

game.allies=game.allies.filter(a=>{
if(!a.alive)return false;

const roughX=Math.abs(a.x-game.player.x);
const roughY=Math.abs(a.y-game.player.y);

if(roughX>2200||roughY>2200){
return false;
}

return dist(a.x,a.y,game.player.x,game.player.y)<2200;
});
},


};

const EnemySystem={

updateEnemies(){
for(const e of this.enemies){
if(!e.alive)continue;

const d=dist(e.x,e.y,this.player.x,this.player.y);

if(
e.bossRank ||
d<CONFIG.activeEnemyRange
){
e.update(this);
}
}

this.updateAllies();
this.separateUnits();
this.autoSpawnEnemies();
},

gameDropAllyItem(x,y,item){
return AllySystem.gameDropAllyItem(this,x,y,item);
},

updateAllies(){
return AllySystem.updateAllies(this);
},

separateUnits(){
const p=this.player;

const activeEnemies=this.enemies.filter(e=>{
if(!e.alive)return false;
if(e.bossRank)return true;
return dist(e.x,e.y,p.x,p.y)<900;
});

for(const e of activeEnemies){
const minDist=p.size/2+e.size/2+4;
const d=Math.max(1,dist(p.x,p.y,e.x,e.y));

if(d<minDist){
const nx=(e.x-p.x)/d;
const ny=(e.y-p.y)/d;
const push=(minDist-d)*0.45;

if(e.bossRank){
e.x+=nx*push*0.15;
e.y+=ny*push*0.15;
p.x-=nx*push*1.15;
p.y-=ny*push*1.15;
}else{
e.x+=nx*push;
e.y+=ny*push;
p.x-=nx*push*0.35;
p.y-=ny*push*0.35;
}
}
}

for(let i=0;i<activeEnemies.length;i++){
const a=activeEnemies[i];

for(let j=i+1;j<activeEnemies.length;j++){
const b=activeEnemies[j];

const minDist=a.size/2+b.size/2+3;
const d=Math.max(1,dist(a.x,a.y,b.x,b.y));

if(d<minDist){
const nx=(b.x-a.x)/d;
const ny=(b.y-a.y)/d;
const push=(minDist-d)*0.35;

a.x-=nx*push;
a.y-=ny*push;
b.x+=nx*push;
b.y+=ny*push;
}
}
}

if(this.allies){

for(const a of this.allies){
if(!a.alive)continue;

const minDist=28;
const d=Math.max(1,dist(p.x,p.y,a.x,a.y));

if(d<minDist){
const nx=(a.x-p.x)/d;
const ny=(a.y-p.y)/d;
const block=minDist-d;

p.x-=nx*block;
p.y-=ny*block;
}
}

for(let i=0;i<this.allies.length;i++){
const a=this.allies[i];
if(!a.alive)continue;

for(let j=i+1;j<this.allies.length;j++){
const b=this.allies[j];
if(!b.alive)continue;

const minDist=26;
const d=Math.max(1,dist(a.x,a.y,b.x,b.y));

if(d<minDist){
const nx=(b.x-a.x)/d;
const ny=(b.y-a.y)/d;
const push=(minDist-d)*0.35;

a.x-=nx*push;
a.y-=ny*push;
b.x+=nx*push;
b.y+=ny*push;
}
}
}

for(const a of this.allies){
if(!a.alive)continue;

for(const e of activeEnemies){
const minDist=28+e.size/2;
const d=Math.max(1,dist(a.x,a.y,e.x,e.y));

if(d<minDist){
const nx=(e.x-a.x)/d;
const ny=(e.y-a.y)/d;
const push=(minDist-d)*0.22;

a.x-=nx*push;
a.y-=ny*push;
e.x+=nx*push;
e.y+=ny*push;
}
}
}
}

p.x=clamp(p.x,10,CONFIG.worldW-10);
p.y=clamp(p.y,10,CONFIG.worldH-10);

for(const e of activeEnemies){
e.x=clamp(e.x,10,CONFIG.worldW-10);
e.y=clamp(e.y,10,CONFIG.worldH-10);
}

if(this.allies){
for(const a of this.allies){
a.x=clamp(a.x,10,CONFIG.worldW-10);
a.y=clamp(a.y,10,CONFIG.worldH-10);
}
}
}

};

const DropSystem={

updateDrops(){
for(const e of this.enemies){
if(!e.alive&&!e.dropped){
e.dropped=true;

if(!e.killedByAlly){

const goldGain=Math.max(
1,
Math.floor(e.level*0.7+e.bossRank*3+Math.random()*4)
);

this.player.gold=(this.player.gold||0)+goldGain;
this.addLog(`${e.name}から${goldGain}G入手`);

if(!this.player.materials){
this.player.materials={
"鉄くず":0,
"毛皮":0,
"糸":0,
"石材":0
};
}

let materialName="鉄くず";

if(e.type==="wolf")materialName="毛皮";
else if(e.type==="spider")materialName="糸";
else if(e.type==="golem")materialName="石材";

const materialGain=e.bossRank?randInt(2,5):1;

this.player.materials[materialName]=(this.player.materials[materialName]||0)+materialGain;
this.addLog(`${materialName} +${materialGain}`);

}

const weaponItem=LootFactory.create(e,this);
weaponItem.type="weapon";

const enemyWeaponMap={
daggerGoblin:"dagger",
goblin:"sword",
spearman:"spear",
greatsword:"greatsword"
};

const fixedKind=enemyWeaponMap[e.type]||"sword";

const tpl=WEAPON_NAMES.find(w=>w.kind===fixedKind)||WEAPON_NAMES[1];

weaponItem.kind=tpl.kind;
weaponItem.name=baseWeaponName(weaponItem.kind,weaponItem.affixes.length);
weaponItem.displayName=affixPrefixName(weaponItem)+weaponItem.name;

this.drops.push(new LootDrop(e.x-10,e.y,weaponItem));
this.addLog(`${e.name}が${weaponItem.displayName||weaponItem.name}を落とした`);

if(Math.random()<.45){
let item=LootFactory.create(e,this);

if(item.type==="weapon"){
item=LootFactory.create(e,this);
}

if(item.type!=="weapon"){
this.drops.push(new LootDrop(e.x+10,e.y,item));
this.addLog(`${e.name}が追加で${item.displayName||item.name}を落とした`);
}
}
}
}

this.drops=this.drops.filter(d=>d.update(this));

},

drawDrops(){
for(const d of this.drops)d.draw(this.ctx,this.camera);
}

};

const EffectSystem={

spawnAffixBurst(game,x,y,mode){
const list=game.inventory.equippedAffixes();
const active=list.length?list:[{stat:"attack",value:3}];

for(const a of active){
game.effects.push(new VisualEffect(x,y,a,mode));
}

if(game.effects.length>180){
game.effects.splice(0,game.effects.length-180);
}
},

updateEffects(game){
for(const fx of game.effects){
fx.update();
}

game.effects=game.effects.filter(e=>e.life>0);
},

drawEffects(game){
for(const fx of game.effects){
fx.draw(game.ctx,game.camera);
}
}

};

const WorldSystem={

isInVillage(game,x,y){
return dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.radius*.9;
},

updatePlayerArea(game,beforeVillage){
game.nearShop=false;
game.nearInn=false;
game.nearCamp=false;

for(const npc of VILLAGE.npcs){
if(npc.label==="Shop"&&dist(game.player.x,game.player.y,npc.x,npc.y)<80){
game.nearShop=true;
}

if(npc.label==="Inn"&&dist(game.player.x,game.player.y,npc.x,npc.y)<80){
game.nearInn=true;
}
}

if(game.camps){
for(const camp of game.camps){
if(dist(game.player.x,game.player.y,camp.x,camp.y)<CAMP_CONFIG.shopRange){
game.nearCamp=true;
game.nearInn=true;
break;
}
}
}

if(game.nearShop&&!game.wasNearShop){
game.addLog("Shop：素材を売却できます");
}

if(game.nearInn&&!game.wasNearInn){
game.addLog(game.nearCamp?"Camp：薬草を購入できます":"Inn：薬草を購入できます");
}

game.wasNearShop=game.nearShop;
game.wasNearInn=game.nearInn;

if(!beforeVillage&&game.playerInVillage)game.autoSave();

if(game.wasInVillage&&!game.playerInVillage){
game.reviveEnemiesFromVillageExit();
}

game.wasInVillage=game.playerInVillage;

if(game.playerInVillage&&game.player.hp<game.player.maxHp){
game.player.hp=clamp(
game.player.hp+VILLAGE.healRate+stat(game,"hp")*.002,
0,
game.player.maxHp
);
}
},

updatePlayer(game){
const beforeVillage=game.playerInVillage;

game.playerInVillage=this.isInVillage(game,game.player.x,game.player.y);

game.player.update(game);

game.playerInVillage=this.isInVillage(game,game.player.x,game.player.y);

this.updatePlayerArea(game,beforeVillage);
},

updateWorld(game){
game.camera.follow(game.player);
this.updateCamps(game);

const area=AreaData.byLocation(game.player.x,game.player.y);

if(!game.currentArea||game.currentArea.key!==area.key){
game.currentArea=area;
game.currentBgmKey=area.bgm;
game.addLog(`${area.name}に入った`);
}
},

updateCamps(game){
if(!game.camps)game.camps=[];

for(const camp of game.camps){
const d=dist(game.player.x,game.player.y,camp.x,camp.y);

if(d<camp.radius){
camp.life=Math.max(camp.life,60);
game.player.hp=clamp(
game.player.hp+CAMP_CONFIG.healRate,
0,
game.player.maxHp
);
}

camp.life--;

if(camp.life<=0){
const zone=AreaData.zones.find(z=>z.key===camp.zoneKey);
if(zone){
game.respawnCamp(zone);
}
}
}

game.nearCamp=game.camps.some(
camp=>dist(game.player.x,game.player.y,camp.x,camp.y)<CAMP_CONFIG.shopRange
);
}

};

const Renderer={

draw(game){
const ctx=game.ctx;
ctx.clearRect(0,0,CONFIG.viewW,CONFIG.viewH);

ctx.save();
ctx.translate(CONFIG.viewW/2,CONFIG.viewH/2);
ctx.scale(1.5,1.5);
ctx.translate(-CONFIG.viewW/2,-CONFIG.viewH/2);

game.world.draw(ctx,game.camera);
game.drawCamps();

if(game.playerInVillage)game.drawVillageBanner();

game.drawDrops();

for(const e of game.enemies)e.draw(ctx,game.camera);

if(game.allies){
for(const a of game.allies){

if(!a.alive)continue;

const x=game.camera.sx(a.x);
const y=game.camera.sy(a.y);

const allyArmor=a.armor;
const allyHead=a.head;
const allyArm=a.arm;

const armorSpec=ARMOR_TYPES.find(v=>v.key===allyArmor?.kind)||ARMOR_TYPES[0];
const headSpec=HEAD_TYPES.find(v=>v.key===allyHead?.kind)||HEAD_TYPES[0];
const armSpec=ARM_TYPES.find(v=>v.key===allyArm?.kind)||ARM_TYPES[0];

ctx.fillStyle=allyArmor?itemRankColor(allyArmor):"#4da6ff";
ctx.fillRect(x-10,y-10,20,20);

ctx.fillStyle=allyArm?itemRankColor(allyArm):armSpec.color;
ctx.fillRect(x-15,y-8,5,14);
ctx.fillRect(x+10,y-8,5,14);

ctx.fillStyle="#f0c090";
ctx.fillRect(x-7,y-20,14,12);

ctx.fillStyle=allyHead?itemRankColor(allyHead):headSpec.color;
ctx.fillRect(x-8,y-23,16,5);

if(a.attackAnim>0){
a.attackAnim--;

const total=Math.max(1,a.attackTotal||14);
const progress=clamp((total-a.attackAnim)/total,0,1);

const baseAngle=Math.atan2(a.attackDirY||1,a.attackDirX||0);
const arc=2.1;
const len=42;
const swordAngle=baseAngle-arc/2+progress*arc;

const sx=x+Math.cos(swordAngle)*len;
const sy=y+Math.sin(swordAngle)*len;

ctx.strokeStyle="#ffffff";
ctx.lineWidth=4;
ctx.lineCap="round";
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(sx,sy);
ctx.stroke();

ctx.strokeStyle="#bfe2ff";
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(sx,sy);
ctx.stroke();
}

ctx.fillStyle="#ffffff";
ctx.font="10px monospace";
ctx.textAlign="center";
ctx.fillText("ALLY",x,y-20);
ctx.textAlign="left";
}
}

for(const p of game.projectiles)p.draw(ctx,game.camera);
for(const p of game.enemyProjectiles)p.draw(ctx,game.camera);
game.drawEffects();

if(game.testRangeView)game.drawAttackRanges();

game.player.draw(ctx,game.camera);

ctx.restore();

game.drawAreaName();

if(game.paused)game.drawOverlay("PAUSE");
if(game.player.hp<=0)game.drawOverlay("GAME OVER");

},

drawOverlay(game,label){
return game.drawOverlay(label);
},

drawAreaName(game){
return game.drawAreaName();
},

drawCamps(game){
return game.drawCamps();
},

drawVillageBanner(game){
return game.drawVillageBanner();
}

};


const GameController={

update(game){
InputSystem.update(game);

if(!game.gameStarted){
UISystem.update(game);
return;
}

if(game.player.hp<=0){

if(game.gameOverTimer==null){
game.gameOverTimer=60;
}

game.gameOverTimer--;

if(game.gameOverTimer<=0){
const titleScreen=document.getElementById("titleScreen");
if(titleScreen)titleScreen.style.display="flex";

game.gameStarted=false;
game.gameOverTimer=null;
game.restartGame(true);
}

game.updateUI();
return;
}

if(InputSystem.handlePauseMenu(game))return;

game.updatePlayer();
game.updateEnemies();
game.updateProjectiles();
game.updateEnemyProjectiles();
game.updateEffects();
game.updateDrops();
game.updateWorld();
game.updateUI();
},

draw(game){
return Renderer.draw(game);
},

loop(game,now=0){
if(!game.lastTime)game.lastTime=now;

game.dt=Math.min(
2,
(now-game.lastTime)/16.666
);

game.lastTime=now;

game.update();
game.draw();

requestAnimationFrame(t=>game.loop(t));
}

};

const titleLoadBtn=document.getElementById("titleLoadBtn");
const bootLogoS=document.getElementById("bootLogoS");

let titleBgmTimer=null;
let audioCtx=null;

function getAudio(){
try{
if(!audioCtx){
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
if(audioCtx.state==="suspended"){
audioCtx.resume();
}
return audioCtx;
}catch(e){
return null;
}
}

function playNote(freq,start,len=0.14,vol=0.05){
const ac=getAudio();
if(!ac)return;

const o=ac.createOscillator();
const g=ac.createGain();

o.type="square";
o.frequency.setValueAtTime(freq,ac.currentTime+start);

g.gain.setValueAtTime(0.001,ac.currentTime+start);
g.gain.exponentialRampToValueAtTime(vol,ac.currentTime+start+0.01);
g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+start+len);

o.connect(g);
g.connect(ac.destination);

o.start(ac.currentTime+start);
o.stop(ac.currentTime+start+len+0.02);
}

function playBootChime(){
playNote(880,0,0.18,0.08);
playNote(1320,0.12,0.2,0.07);
playNote(1760,0.24,0.25,0.06);
}

function playTitleMelody(){
const notes=[523,659,784,659,523,659,880,784];

notes.forEach((n,i)=>{
playNote(n,i*0.18,0.14,0.045);
});
}

function startTitleBgm(){
if(titleBgmTimer)return;

playTitleMelody();

titleBgmTimer=setInterval(()=>{
playTitleMelody();
},2200);
}

function stopTitleBgm(){
if(titleBgmTimer){
clearInterval(titleBgmTimer);
titleBgmTimer=null;
}
}

if(bootBtn){

bootBtn.classList.remove("show");

setTimeout(()=>{

if(bootLogoS){
bootLogoS.classList.add("pop");
}

setTimeout(()=>{
bootBtn.classList.add("show");
},250);

},2200);

bootBtn.addEventListener("click",()=>{

getAudio();
playBootChime();

if(bootScreen)bootScreen.style.display="none";
if(titleScreen)titleScreen.style.display="flex";

startTitleBgm();

});
}

if(titleStartBtn){
titleStartBtn.addEventListener("click",()=>{

stopTitleBgm();

if(titleScreen)titleScreen.style.display="none";

this.restartGame();
this.paused=false;
this.menuOpen=false;
this.gameStarted=true;
this.lastTime=performance.now();

});
}

if(titleLoadBtn){
titleLoadBtn.addEventListener("click",()=>{

stopTitleBgm();

if(titleScreen)titleScreen.style.display="none";

this.paused=false;
this.menuOpen=false;
this.gameStarted=true;
this.loadGame();
this.lastTime=performance.now();

});
}

requestAnimationFrame(t=>this.loop(t));
}
spawnInitialEnemies(){
return SpawnSystem.spawnInitialEnemies.call(this);
}

createInitialCamps(){
this.camps=[];

for(const zone of AreaData.zones){
this.respawnCamp(zone);
}
}

respawnCamp(zone){
let x=VILLAGE.x;
let y=VILLAGE.y;
let ok=false;

for(let i=0;i<200;i++){
const rate=rand(zone.min,Math.min(zone.max,1));
const angle=rand(0,Math.PI*2);
const r=rate*MAX_VILLAGE_DISTANCE;

x=clamp(
VILLAGE.x+Math.cos(angle)*r,
120,
CONFIG.worldW-120
);

y=clamp(
VILLAGE.y+Math.sin(angle)*r,
120,
CONFIG.worldH-120
);

if(dist(x,y,VILLAGE.x,VILLAGE.y)<CAMP_CONFIG.minVillageDistance){
continue;
}

if(AreaData.byLocation(x,y).key!==zone.key){
continue;
}

ok=true;
break;
}

if(!ok)return null;

const camp={
x,
y,
zoneKey:zone.key,
zoneName:zone.name,
radius:CAMP_CONFIG.radius,
life:CAMP_CONFIG.lifeTime,
maxLife:CAMP_CONFIG.lifeTime
};

this.camps=this.camps.filter(c=>c.zoneKey!==zone.key);
this.camps.push(camp);

return camp;
}
spawnEnemyOutsideView(){
return SpawnSystem.spawnEnemyOutsideView.call(this);
}

spawnAllyOutsideView(){
return SpawnSystem.spawnAllyOutsideView.call(this);
}

spawnSquadOutsideView(){
return SpawnSystem.spawnSquadOutsideView.call(this);
}
addEnemyAt(x,y){
return SpawnSystem.addEnemyAt.call(this,x,y);
}

spawnSquadAt(x,y){
return SpawnSystem.spawnSquadAt.call(this,x,y);
}
cleanupEnemies(){
return SpawnSystem.cleanupEnemies.call(this);
}
autoSpawnEnemies(){
return SpawnSystem.autoSpawnEnemies.call(this);
}
addLog(t){
return LogSystem.add(this,t);
}
isInVillage(x,y){return WorldSystem.isInVillage(this,x,y)}
reviveEnemiesFromVillageExit(){for(const e of this.enemies)e.reviveAtSpawn();this.addLog("村の外に敵が復活した")}
spawnAffixBurst(x,y,mode){
return EffectSystem.spawnAffixBurst(this,x,y,mode);
}
castMagic(){
const a=Math.atan2(this.player.dirY,this.player.dirX);
const m=this.inventory.magicSpec();
this.projectiles.push(new Projectile(this.player.x,this.player.y,Math.cos(a)*CONFIG.fireballSpeed,Math.sin(a)*CONFIG.fireballSpeed,m));
}
saveData(){
return SaveSystem.buildData(this);
}

applySaveData(data){
return SaveSystem.applyData(this,data);
}

saveGame(label="SAVE"){
return SaveSystem.save(this,label);
}

manualSave(){
return SaveSystem.save(this,"SAVE");
}

autoSave(){
return SaveSystem.save(this,"AUTO SAVE");
}

loadGame(){
return SaveSystem.load(this,"LOAD");
}

tryLoadOnStart(){
return SaveSystem.tryLoadOnStart(this);
}

restartGame(keepSave=false){
if(!keepSave){
SaveSystem.delete();
}

this.inventory=new Inventory();
this.player=new Player();
this.enemies=[];
this.projectiles=[];
this.enemyProjectiles=[];
this.effects=[];
this.drops=[];
this.camps=[];
this.logs=[];
this.paused=false;
this.menuOpen=false;
this.spawnCooldown=0;
this.testRangeView=false;
this.guideVillage=false;
this.guideCamp=false;
this.currentArea=null;
this.currentBgmKey="";
document.getElementById("rangeViewBtn").textContent="攻撃範囲表示 OFF";
this.spawnInitialEnemies();
this.createInitialCamps();
UISystem.refreshInventory(this);
this.playerInVillage=this.isInVillage(this.player.x,this.player.y);
this.wasInVillage=this.playerInVillage;
this.camera.follow(this.player);
this.addLog("最初から開始");
}
updatePlayer(){
const beforeVillage=this.playerInVillage;

this.playerInVillage=this.isInVillage(this.player.x,this.player.y);

this.player.update(this);

this.playerInVillage=this.isInVillage(this.player.x,this.player.y);

this.nearShop=false;
this.nearInn=false;
this.nearCamp=false;

for(const npc of VILLAGE.npcs){
if(npc.label==="Shop"&&dist(this.player.x,this.player.y,npc.x,npc.y)<80){
this.nearShop=true;
}

if(npc.label==="Inn"&&dist(this.player.x,this.player.y,npc.x,npc.y)<80){
this.nearInn=true;
}
}

if(this.camps){
for(const camp of this.camps){
if(dist(this.player.x,this.player.y,camp.x,camp.y)<CAMP_CONFIG.shopRange){
this.nearCamp=true;
this.nearInn=true;
break;
}
}
}

if(this.nearShop&&!this.wasNearShop){
this.addLog("Shop：素材を売却できます");
}

if(this.nearInn&&!this.wasNearInn){
this.addLog(this.nearCamp?"Camp：薬草を購入できます":"Inn：薬草を購入できます");
}

this.wasNearShop=this.nearShop;
this.wasNearInn=this.nearInn;

if(!beforeVillage&&this.playerInVillage)this.autoSave();

if(this.wasInVillage&&!this.playerInVillage)
this.reviveEnemiesFromVillageExit();

this.wasInVillage=this.playerInVillage;

if(this.playerInVillage&&this.player.hp<this.player.maxHp){
this.player.hp=clamp(
this.player.hp+VILLAGE.healRate+stat(this,"hp")*.002,
0,
this.player.maxHp
);
}
}

updateEnemies(){
return EnemySystem.updateEnemies.call(this);
}

gameDropAllyItem(x,y,item){
return EnemySystem.gameDropAllyItem.call(this,x,y,item);
}

updateAllies(){
return EnemySystem.updateAllies.call(this);
}

separateUnits(){
return EnemySystem.separateUnits.call(this);
}

updateProjectiles(){
for(const p of this.projectiles)p.update(this);
this.projectiles=this.projectiles.filter(p=>p.life>0);
}

updateEnemyProjectiles(){
for(const p of this.enemyProjectiles)p.update(this);
this.enemyProjectiles=this.enemyProjectiles.filter(p=>p.life>0);
}

updateEffects(){
return EffectSystem.updateEffects(this);
}

updateDrops(){
return DropSystem.updateDrops.call(this);
}

drawDrops(){
return DropSystem.drawDrops.call(this);
}

drawEffects(){
return EffectSystem.drawEffects(this);
}

updateWorld(){
return WorldSystem.updateWorld(this);
}

updateCamps(){
return WorldSystem.updateCamps(this);
}

updateUI(){
UISystem.update(this);
}

drawAttackRanges(){
const ctx=this.ctx;
const p=this.player;
const c=this.camera;
ctx.save();
const spec=this.inventory.weaponSpec();
let playerRange=spec.range;
ctx.strokeStyle="rgba(80,180,255,.50)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(c.sx(p.x),c.sy(p.y),playerRange,0,Math.PI*2);
ctx.stroke();
ctx.strokeStyle="rgba(255,80,80,.30)";
ctx.lineWidth=2;
for(const e of this.enemies){
if(!e.alive)continue;
const r=CONFIG.enemySwordRange+(e.bossRank?10:0)+Math.min(25,e.level*.25);
ctx.beginPath();
ctx.arc(c.sx(e.x),c.sy(e.y),r,0,Math.PI*2);
ctx.stroke();
}
ctx.restore();
}
update(){
return GameController.update(this);
}

draw(){
return GameController.draw(this);
}
drawOverlay(label){
const ctx=this.ctx;
ctx.fillStyle="rgba(0,0,0,.58)";
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);
ctx.fillStyle="#fff";
ctx.font="36px monospace";
ctx.textAlign="center";
ctx.fillText(label,CONFIG.viewW/2,CONFIG.viewH/2);
ctx.textAlign="left";
}
drawAreaName(){
const area=this.currentArea||AreaData.byLocation(this.player.x,this.player.y);
const ctx=this.ctx;

ctx.fillStyle="rgba(5,7,10,.55)";
ctx.fillRect(12,12,220,70);

ctx.fillStyle="#fff4c7";
ctx.font="13px monospace";
ctx.fillText(area.name,24,32);

if(this.guideVillage){

const dx=VILLAGE.x-this.player.x;
const dy=VILLAGE.y-this.player.y;

let dir="→";

if(Math.abs(dx)>Math.abs(dy)){
dir=dx>0?"→":"←";
}else{
dir=dy>0?"↓":"↑";
}

ctx.fillStyle="#ffd166";
ctx.fillText("村 "+dir,24,52);
}

if(this.guideCamp){
ctx.fillStyle="#9cff9c";
ctx.fillText("Camp数 "+(this.camps?this.camps.length:0),120,52);

if(this.camps&&this.camps.length){

const currentArea=AreaData.byLocation(
this.player.x,
this.player.y
);

let nearest=null;

for(const camp of this.camps){

if(camp.zoneKey!==currentArea.key){
continue;
}

nearest=camp;
break;
}

if(nearest){

const dx=nearest.x-this.player.x;
const dy=nearest.y-this.player.y;

let dir="→";

if(Math.abs(dx)>Math.abs(dy)){
dir=dx>0?"→":"←";
}else{
dir=dy>0?"↓":"↑";
}

ctx.fillStyle="#9cff9c";
ctx.fillText(currentArea.name+" Camp "+dir,120,70);
}
}
}
}

drawCamps(){
if(!this.camps)return;

const ctx=this.ctx;
const c=this.camera;

for(const camp of this.camps){
const x=c.sx(camp.x);
const y=c.sy(camp.y);
const blink=camp.life<60*30&&Math.floor(camp.life/15)%2===0;

if(blink)continue;

ctx.fillStyle="rgba(255,220,120,.16)";
ctx.beginPath();
ctx.arc(x,y,camp.radius,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="rgba(255,220,120,.55)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(x,y,camp.radius,0,Math.PI*2);
ctx.stroke();

ctx.fillStyle="#5a3418";
ctx.fillRect(x-22,y-10,44,20);

ctx.fillStyle="#d68a3a";
ctx.beginPath();
ctx.moveTo(x-30,y-10);
ctx.lineTo(x,y-36);
ctx.lineTo(x+30,y-10);
ctx.closePath();
ctx.fill();

const flame=Math.sin(Date.now()*0.01+camp.x)*3;

ctx.fillStyle="rgba(255,180,60,.18)";
ctx.beginPath();
ctx.arc(x+34,y+18,18+flame,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#ffcc55";
ctx.beginPath();
ctx.arc(x+34,y+18,8+flame*0.3,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#ff8844";
ctx.beginPath();
ctx.moveTo(x+34,y+8-flame);
ctx.lineTo(x+28,y+22);
ctx.lineTo(x+40,y+22);
ctx.closePath();
ctx.fill();

ctx.fillStyle="#fff4aa";
ctx.beginPath();
ctx.moveTo(x+34,y+12-flame*0.5);
ctx.lineTo(x+31,y+20);
ctx.lineTo(x+37,y+20);
ctx.closePath();
ctx.fill();

ctx.fillStyle="#fff4c7";
ctx.font="11px monospace";
ctx.textAlign="center";
ctx.fillText(camp.zoneName+"キャンプ",x,y-46);
ctx.textAlign="left";
}
}

drawVillageBanner(){
const ctx=this.ctx;
ctx.fillStyle="rgba(255,232,166,.13)";
ctx.fillRect(0,0,CONFIG.viewW,CONFIG.viewH);
ctx.fillStyle="rgba(5,7,10,.62)";
ctx.fillRect(CONFIG.viewW/2-130,42,260,34);
ctx.fillStyle="#fff4c7";
ctx.font="14px monospace";
ctx.textAlign="center";
ctx.fillText(`${VILLAGE.name} SAFE`,CONFIG.viewW/2,64);
ctx.textAlign="left";
}
loop(now=0){
return GameController.loop(this,now);
}
}
new Game();
